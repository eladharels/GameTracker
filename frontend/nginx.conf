server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Don't advertise the nginx version in Server: / error pages.
  server_tokens off;

  # Docker's embedded DNS resolver. Required because proxy_pass below uses a
  # VARIABLE: that defers upstream resolution to request time, so nginx starts even
  # when the backend container is not up yet (a literal hostname is resolved at
  # config-load time and nginx exits with "host not found in upstream"). It also
  # re-resolves if compose reassigns the backend's IP on restart.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # The container runs with read_only: true and tmpfs on /tmp, /var/cache/nginx and
  # /var/run. Pin every temp path onto tmpfs explicitly rather than relying on the
  # base image's /var/cache/nginx subdirectories, which the tmpfs mount hides.
  client_body_temp_path /tmp/nginx-client-body;
  proxy_temp_path       /tmp/nginx-proxy;

  location / {
    # Security headers live HERE rather than at server level: an add_header inside
    # ANY location cancels every inherited one, so putting them at server level and
    # adding a location /api/ block below would silently drop them for the SPA.
    # (CISO condition for the premium redesign — bounds external cover-art image
    # loads and the Google Fonts dependency.)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.igdb.com https://*.rawg.io https://*.thegamesdb.net; connect-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; worker-src 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;

    try_files $uri $uri/ /index.html;
  }

  # Proxy the API to the backend container.
  #
  # Without this block the frontend image could not serve a working app on its own:
  # the SPA calls `${window.location.origin}/api`, and `try_files` answered those
  # with index.html and HTTP 200 — so the app only worked behind an external reverse
  # proxy that happened to route /api itself, and CI's "frontend returns 200" check
  # would pass against a completely broken stack.
  #
  # If an external proxy already routes /api straight to the backend, this block is
  # simply never reached — it is a correct fallback, not a conflict.
  location /api/ {
    set $gt_api "backend:3000";
    # The variable form of proxy_pass does NOT append the request URI, so pass it
    # explicitly. $request_uri carries the query string too (the ?t= cache-busters).
    #
    # The suppression below must stay on the line IMMEDIATELY above proxy_pass —
    # semgrep anchors it to the next line, not to the block.
    # The rule fires on any variable host in proxy_pass. Here the value is the
    # hardcoded literal on the `set` line above and is never derived from a request
    # header or any other client input, so the injection it warns about is not
    # reachable. The variable form is required: it defers DNS resolution to request
    # time so nginx starts even when the backend container is down.
    # nosemgrep: generic.nginx.security.dynamic-proxy-host.dynamic-proxy-host
    proxy_pass http://$gt_api$request_uri;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # POST /api/user/:username/refresh-metadata holds the connection for up to five
    # minutes (the frontend's axios timeout is 300000 ms). nginx defaults to 60s.
    proxy_connect_timeout 10s;
    proxy_send_timeout    600s;
    proxy_read_timeout    600s;

    # Buffer in memory only — never spool a response to disk on a read-only rootfs.
    proxy_max_temp_file_size 0;
  }
}
