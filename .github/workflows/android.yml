# Build and test the Android app (mobile/) — GameTracker Mobile.
#
# THIS RUNS ON THE PRODUCTION HOST (the only runner is self-hosted; see CLAUDE.md "CI/CD
# Security Pipeline"). A Gradle build executes code nobody here wrote: plugins at
# configuration time, kapt annotation processors at compile time, and every lint.jar bundled
# in a dependency during lint. So Gradle NEVER runs on the host itself:
#
#   - It runs in a throwaway container from a JDK image pinned BY DIGEST, as a fixed
#     non-root uid (BUILD_UID: the runner itself runs as root, so its own uid is not one), with every capability dropped, no-new-privileges, memory/CPU/PID limits, and a
#     noexec /tmp. It gets ONLY mobile/ mounted: no Docker socket, no $HOME, no .git, no
#     secrets, no runner environment.
#   - Its SDK and Gradle caches live in named volumes, split between pull requests and main
#     (as the smoke stacks are). That split prevents ACCIDENTS, not attacks: on a pull
#     request the PR's own copy of this file runs, and can name main's volumes. The same-repo
#     gate below is the boundary, exactly as in docker-build-deploy.yml.
#   - Nothing EXECUTABLE is trusted from a cache volume, because every later build can write
#     to it. The SDK is wiped and reinstalled every run. The Gradle home keeps only the
#     dependency cache (caches/modules-2), which strict verification re-checks. It is pruned
#     BEFORE the build as well as after: a build killed by the timeout or a cancellation never
#     reaches the second prune, and an init.d script or gradle.properties left in the Gradle
#     home would run in the next build. The wrapper distribution is downloaded again every
#     run, so distributionSha256Sum checks it every run.
#   - Everything it downloads is pinned: the command-line tools zip (SHA-256, re-hashed and
#     re-extracted every run), the Gradle distribution (distributionSha256Sum in
#     gradle-wrapper.properties), the wrapper jar (below), and every dependency
#     (gradle/verification-metadata.xml, --dependency-verification strict).
#
# Residual risk, recorded:
#   - The SDK components sdkmanager installs (platform, build-tools) are verified only against
#     Google's own repository metadata.
#   - The build container is on Docker's default bridge network, so the build code (kapt
#     processors, lint jars, unit tests) can reach every port this host publishes: the backend
#     on BACKEND_BIND, the MCP port, the smoke stacks, and the LAN, including the directory
#     server. Splitting the build into a networked resolve phase and an --offline phase under
#     --network none is MOB-37 in mobile/ROADMAP.md.
#
# Deliberately a SEPARATE workflow from docker-build-deploy.yml: path filters exist only at
# workflow level, and this job must never gate, trigger or delay `deploy` by dependency.
# There is one runner, so jobs still run one at a time — a mobile build can make a deploy
# wait its turn, never skip it.
name: Android — GameTracker Mobile

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

concurrency:
  group: gametracker-android-${{ github.ref }}
  cancel-in-progress: true

env:
  # eclipse-temurin:17-jdk-jammy, pinned by digest: a tag can be moved upstream.
  JDK_IMAGE: eclipse-temurin:17-jdk-jammy@sha256:60fcdd4a85c94a23ef86d0d55867c6a8dbc4f7c3efc8286e259956c3ea4ef08c
  # Published on developer.android.com/studio ("Command line tools only").
  CMDLINE_TOOLS_ZIP: commandlinetools-linux-15859902_latest.zip
  CMDLINE_TOOLS_SHA256: 4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583
  # The committed mobile/gradle/wrapper/gradle-wrapper.jar, a genuine Gradle release
  # (matches the published wrapper checksum). A changed jar fails the build until re-pinned.
  GRADLE_WRAPPER_JAR_SHA256: e996d452d2645e70c01c11143ca2d3742734a28da2bf61f25c82bdc288c9e637
  ANDROID_PLATFORM: 'platforms;android-36'
  ANDROID_BUILD_TOOLS: 'build-tools;35.0.0'
  # One set of cache volumes per partition. Never shared between PRs and main.
  VOLUME_PARTITION: ${{ github.event_name == 'push' && 'main' || 'pr' }}
  # The uid Gradle runs as. NOT the runner's: the self-hosted runner runs as root, and
  # `--user "$(id -u)"` built as uid 0 until the in-container guard refused it (PR #6).
  BUILD_UID: '10001'
  # Past this, a cache volume is wiped rather than trimmed (UP-25: this disk filled once).
  VOLUME_CAP_MB: '4096'

jobs:
  android:
    name: Build & test the Android app
    # ── SAME-REPO GATE ─────────────────────────────────────────────────────────────────
    # This repository is public and the runner is the production host. A fork's pull
    # request must never run here: the gate below skips it, exactly as every job in
    # docker-build-deploy.yml does. test/runtime.test.js enforces the gate on every job
    # of every workflow with a pull_request trigger.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Report disk and enforce the free-space floor (UP-25)
        run: |
          ROOT_DIR="$(docker info --format '{{.DockerRootDir}}')"
          echo "[android] Docker root: ${ROOT_DIR}"
          df -h "${ROOT_DIR}"
          FREE_KB="$(df -Pk "${ROOT_DIR}" | awk 'NR==2 {print $4}')"
          if [ "${FREE_KB}" -lt 5242880 ]; then
            echo "::error::Less than 5 GiB free under ${ROOT_DIR}. Refusing to build on the production host (ROADMAP UP-25)."
            exit 1
          fi

      - name: Verify the Gradle wrapper jar
        run: |
          echo "${GRADLE_WRAPPER_JAR_SHA256}  mobile/gradle/wrapper/gradle-wrapper.jar" | sha256sum -c

      - name: Fetch and verify the Android command-line tools
        run: |
          DL="$(mktemp -d "${RUNNER_TEMP}/android-dl.XXXXXXXX")"
          echo "ANDROID_DL=${DL}" >> "$GITHUB_ENV"
          curl -fsSL --retry 3 -o "${DL}/${CMDLINE_TOOLS_ZIP}" "https://dl.google.com/android/repository/${CMDLINE_TOOLS_ZIP}"
          echo "${CMDLINE_TOOLS_SHA256}  ${DL}/${CMDLINE_TOOLS_ZIP}" | sha256sum -c
          # mktemp -d is 0700 and the runner is root: the build uid must be able to read it.
          chmod 755 "${DL}" && chmod 644 "${DL}/${CMDLINE_TOOLS_ZIP}"

      - name: Prepare the cache volumes and the source tree
        run: |
          for v in sdk gradle; do docker volume create "gametracker-android-${v}-${VOLUME_PARTITION}" >/dev/null; done
          # The volumes (root-owned when new, or holding files from builds that ran as root) and
          # the checkout's mobile/ go to BUILD_UID. CHOWN and DAC_READ_SEARCH are the ONLY
          # capabilities, and there is no network: this container does nothing but change
          # owners. DAC_READ_SEARCH (read and traverse, never write) is needed because a
          # previous build as BUILD_UID leaves 0700 directories that root without it cannot
          # enter ("cannot read directory '/gradle/daemon/8.13'", PR #6). The always() step at the
          # end hands mobile/ back to the runner.
          docker run --rm --network none --cap-drop ALL --cap-add CHOWN --cap-add DAC_READ_SEARCH --security-opt no-new-privileges \
            -v "gametracker-android-sdk-${VOLUME_PARTITION}:/sdk" \
            -v "gametracker-android-gradle-${VOLUME_PARTITION}:/gradle" \
            -v "${GITHUB_WORKSPACE}/mobile:/work" \
            "${JDK_IMAGE}" chown -R "${BUILD_UID}:${BUILD_UID}" /sdk /gradle /work

      # A cancelled job kills the `docker run` CLIENT, not the container: the build kept running
      # on the production host and held the Gradle cache lock, so the next run timed out
      # waiting for it (seen on PR #6). The container therefore has a fixed name per partition,
      # any leftover is removed before starting, and the always() step at the end removes it,
      # cancelled or not.
      - name: Remove a build container left behind by a cancelled run
        run: docker rm -f "gametracker-android-build-${VOLUME_PARTITION}" >/dev/null 2>&1 || true

      - name: Build and test inside the container
        run: |
          docker run --rm --name "gametracker-android-build-${VOLUME_PARTITION}" \
            --user "${BUILD_UID}:${BUILD_UID}" \
            --cap-drop ALL --security-opt no-new-privileges \
            --memory 4g --cpus 2 --pids-limit 1024 \
            --tmpfs /tmp:rw,noexec,nosuid,size=1g \
            -v "${GITHUB_WORKSPACE}/mobile:/work" \
            -v "${ANDROID_DL}:/dl:ro" \
            -v "gametracker-android-sdk-${VOLUME_PARTITION}:/sdk" \
            -v "gametracker-android-gradle-${VOLUME_PARTITION}:/gradle" \
            -e HOME=/gradle/home -e GRADLE_USER_HOME=/gradle -e ANDROID_HOME=/sdk \
            -e ANDROID_USER_HOME=/gradle/android-user -e JAVA_TOOL_OPTIONS=-Djava.io.tmpdir=/gradle/tmp \
            -e CMDLINE_TOOLS_ZIP -e CMDLINE_TOOLS_SHA256 -e ANDROID_PLATFORM -e ANDROID_BUILD_TOOLS \
            -w /work \
            "${JDK_IMAGE}" bash -euo pipefail -c '
              # Never the root uid, whatever --user says (the runner itself is root).
              [ "$(id -u)" != 0 ] || { echo "::error::refusing to build as uid 0"; exit 1; }
              # Before the build, not only after it: a killed build never reaches the prune at
              # the end, and Gradle loads init.d/ and gradle.properties from its home on start.
              find /gradle -mindepth 1 -maxdepth 1 ! -name caches -exec rm -rf {} +
              find /gradle/caches -mindepth 1 -maxdepth 1 ! -name modules-2 -exec rm -rf {} + 2>/dev/null || true
              mkdir -p /gradle/home /gradle/android-user /gradle/tmp
              # Build outputs never outlive the job, whatever happens below.
              trap "rm -rf /work/build /work/app/build /work/.gradle /work/.kotlin" EXIT

              # Re-verified and re-extracted every run: a cache volume is writable by every
              # later build, so nothing in it is trusted as "already installed".
              echo "${CMDLINE_TOOLS_SHA256}  /dl/${CMDLINE_TOOLS_ZIP}" | sha256sum -c
              # The WHOLE SDK, not only the tools: platform and build-tools binaries (aapt2, d8)
              # execute, so they are reinstalled and re-verified by sdkmanager every run.
              find /sdk -mindepth 1 -maxdepth 1 -exec rm -rf {} +
              mkdir -p /sdk/cmdline-tools/extract
              (cd /sdk/cmdline-tools/extract && jar xf "/dl/${CMDLINE_TOOLS_ZIP}")
              mv /sdk/cmdline-tools/extract/cmdline-tools /sdk/cmdline-tools/latest
              rm -rf /sdk/cmdline-tools/extract
              chmod +x /sdk/cmdline-tools/latest/bin/*
              SDKM=/sdk/cmdline-tools/latest/bin/sdkmanager
              (yes || true) | "${SDKM}" --sdk_root=/sdk --licenses >/dev/null
              "${SDKM}" --sdk_root=/sdk "${ANDROID_PLATFORM}" "${ANDROID_BUILD_TOOLS}"

              # Every dependency, plugins included, must match gradle/verification-metadata.xml
              # (sha256). It was generated by this job over the final dependency set on PR #6
              # and reviewed before it was committed: trust-on-first-use, recorded. A dependency
              # change regenerates it, locally, and the diff is reviewed like code.
              status=0
              bash gradlew --no-daemon --dependency-verification strict \
                testDebugUnitTest testReleaseUnitTest lintDebug assembleRelease || status=$?

              # Keep only the dependency cache; the rest is regenerated.
              find /gradle -mindepth 1 -maxdepth 1 ! -name caches -exec rm -rf {} +
              find /gradle/caches -mindepth 1 -maxdepth 1 ! -name modules-2 -exec rm -rf {} + 2>/dev/null || true
              exit "${status}"
            '

      - name: Report disk and cap the cache volumes (UP-25)
        if: always()
        run: |
          # First: never leave a build running on the host, even when this job was cancelled.
          docker rm -f "gametracker-android-build-${VOLUME_PARTITION}" >/dev/null 2>&1 || true
          # Give mobile/ back to the runner, so the next checkout can clean and update it.
          docker run --rm --network none --cap-drop ALL --cap-add CHOWN --cap-add DAC_READ_SEARCH --security-opt no-new-privileges \
            -v "${GITHUB_WORKSPACE}/mobile:/work" \
            "${JDK_IMAGE}" chown -R "$(id -u):$(id -g)" /work \
            || echo "::warning::could not hand mobile/ back to the runner; the next checkout cleans it"
          for v in sdk gradle; do
            name="gametracker-android-${v}-${VOLUME_PARTITION}"
            docker volume inspect "${name}" >/dev/null 2>&1 || continue
            MB="$(docker run --rm --network none --cap-drop ALL --cap-add DAC_READ_SEARCH -v "${name}:/v:ro" "${JDK_IMAGE}" du -sm /v | cut -f1)"
            echo "[android] ${name}: ${MB} MB"
            if [ "${MB}" -gt "${VOLUME_CAP_MB}" ]; then
              echo "[android] ${name} is over ${VOLUME_CAP_MB} MB: removing it"
              docker volume rm "${name}" >/dev/null
            fi
          done
          df -h "$(docker info --format '{{.DockerRootDir}}')"
