name: Build, Secure & Deploy — GameTracker Production

on:
  push:
    branches:
      - main
  # PRs targeting main run everything EXCEPT deploy. Before this, the pipeline ran
  # only after merge -- so "CI is green" and "it is live in production" were the same
  # event, and the first real exercise of any change was the deploy itself.
  #
  # THREE things make this safe. The first is the one that matters, and the first version
  # of this trigger shipped without it -- a CISO review caught that before merge.
  #
  #   1. EVERY JOB IS GATED TO SAME-REPO PULL REQUESTS. This repository is PUBLIC and the
  #      runner is self-hosted -- and it is the production host itself: `deploy` brings up
  #      docker-compose.yaml on it and health-checks localhost:3000. A fork PR that runs
  #      here reaches the live database, JWT_SECRET, the LDAP bind password and a Docker
  #      socket, through `npm ci` scripts, a PR-authored Dockerfile's RUN lines, or the
  #      containers the smoke stack starts. GitHub's approval prompt for first-time
  #      contributors is not a boundary: one merged typo fix and later fork PRs run
  #      automatically. A branch INSIDE this repo needs push access, which is already
  #      enough to deploy, so gating on the head repo keeps the trust boundary where it
  #      already was rather than widening it.
  #   2. The `deploy` job is guarded on `github.event_name == 'push'` AND the ref.
  #      It has no guard of its own historically -- it relied ENTIRELY on this trigger
  #      list to never see a non-main event. Adding a trigger without adding that guard
  #      would have deployed every pull request to production.
  #   3. `build-images` tags PR builds `pr-<number>`, never `latest`. Both compose files
  #      resolve `local/gametracker-*:latest` on the same Docker daemon production runs
  #      on, so a PR build writing `:latest` would leave the next `docker compose up` --
  #      an operator restart, a reboot, the next deploy -- silently starting production
  #      on unreviewed PR code.
  #
  # WHAT 1 DEPENDS ON, which is a property of REPOSITORY CONFIGURATION that nothing in
  # this file enforces. Gating on the head repo is equivalent to the pre-existing trust
  # boundary only while push access to this repo ALREADY implies deploy. Today that holds:
  # one collaborator (the owner, admin) and `main` unprotected, so anyone who can push a
  # branch here can already push to main and deploy. Add branch protection to `main`, or a
  # collaborator with push-but-not-merge rights, and it STOPS holding -- a contributor who
  # cannot merge would then be able to run code on the production host by opening a pull
  # request. At that point the PR path must move to GitHub-hosted runners, or the repo must
  # go private. Re-read this comment before changing either setting.
  #
  # AND: a fork PR renders as ten SKIPPED checks, not as a failure. GitHub treats a skipped
  # check as non-blocking, so such a PR can look mergeable having had ZERO ci. Merging still
  # needs write access, so this is not a bypass -- but "skipped" must never be read as
  # "tested".
  #
  # BE PRECISE ABOUT WHAT 2 AND 3 DO: they prevent ACCIDENTS. Both live in a file the pull
  # request itself controls on a `pull_request` event, so against code that is actively
  # hostile they are one deleted line each. Only 1 is a boundary against untrusted code,
  # and even 1 is a stopgap -- the durable answers are making the repository private or
  # running the PR path on GitHub-hosted runners.
  pull_request:
    branches:
      - main

# Prevent concurrent runs from conflicting on the self-hosted runner.
# cancel-in-progress: false ensures the second push queues instead of
# cancelling an in-progress run that may hold Docker ports.
# PARTITIONED BY EVENT. A single group holds at most ONE pending run: with a deploy in
# flight and a second queued, a third arrival CANCELS the queued one. Once pull requests
# entered this group that third arrival could be a PR, silently evicting the queued run
# for a merge commit -- and nothing surfaces it, because `deploy` was never skipped, the
# run was cancelled before reaching it. A merge that never deployed and never said so.
#
# What the single group was really protecting is the runner's fixed resources: the smoke
# stack's ports (3099/8099/3199) and the `gametracker-smoke` compose project name, plus
# the production stack itself. That exclusivity moves down to the two jobs that actually
# contend for them, where it belongs.
#
# The smoke-test job's own group is partitioned the same way (ROADMAP UP-6). A job-level
# group also holds one pending item, so while it was shared, PR-A's smoke-test running +
# a main run's queued + PR-B's arriving CANCELLED the main run's smoke-test, and `deploy`
# (which needs it) was skipped: a merge that never deployed. That could not be fixed by
# partitioning while docker-compose.test.yml hard-coded container_names; now each run has
# its own compose project and each partition its own host ports, so a PR can never evict
# a main run. Within the main partition a newer merge can still replace a QUEUED older
# one -- harmless, since main is linear and the newer commit contains the older.
concurrency:
  group: gametracker-pipeline-${{ github.event_name == 'push' && 'main' || github.event.number }}
  cancel-in-progress: false

# EVERY `uses:` IS PINNED TO A COMMIT SHA, with the release it came from in a trailing
# comment (ROADMAP SEC-4). A tag like `@v4` is mutable: whoever controls the upstream repo
# can move it, and the next run executes that code on THIS runner -- the production host,
# beside JWT_SECRET, the Docker socket and the live database. A SHA cannot move.
# Semgrep's mutable-action-tag rule was excluded to tolerate the tags; it is back on.
# test/runtime.test.js fails on an unpinned `uses:`. Bump a pin deliberately:
#   git ls-remote https://github.com/<owner>/<repo> refs/tags/<tag>
# and read the release notes first. There is NO Dependabot here on purpose -- see
# ROADMAP SEC-4 for why a bot author weakens the same-repo pull-request gate below.
#
# Least privilege. Without this the default token may be read+write, and
# actions/checkout persists it into .git/config on a PERSISTENT self-hosted runner.
permissions:
  contents: read

jobs:

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1: Secret Scanning — Gitleaks
  # Scans the full git history for accidentally committed secrets.
  # ─────────────────────────────────────────────────────────────────────────────
  secret-scan:
    name: Secret Scanning (Gitleaks)
    runs-on: self-hosted
    # SAME-REPO ONLY. This repository is PUBLIC and every job here runs on a
    # SELF-HOSTED runner that is the production host itself -- the deploy job brings up
    # docker-compose.yaml on it and health-checks localhost:3000. Without this line a
    # `pull_request` trigger means anyone on the internet can fork, open a PR, and run
    # code beside the live database, JWT_SECRET and the LDAP bind password. A fork PR
    # skips every job instead; a branch inside this repo needs push access, which is
    # already enough to deploy, so this keeps the pre-existing trust boundary exactly
    # where it was. See the CISO note in CLAUDE.md -- the deploy guard and the image tag
    # do NOT cover this; they prevent accidents, not attacks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    continue-on-error: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Gitleaks (if not cached on runner)
        run: |
          set -euo pipefail
          GITLEAKS_VERSION="8.21.2"
          # Reinstall unless the pinned version is already on PATH, so a stubbed
          # binary cannot silently disable the secret scan on a persistent runner.
          if [ "$(gitleaks version 2>/dev/null)" != "${GITLEAKS_VERSION}" ]; then
            echo "[gitleaks] Downloading pinned v${GITLEAKS_VERSION}..."
            curl -sSfL --proto '=https' --tlsv1.2 \
              "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
              -o /tmp/gitleaks.tar.gz
            tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
            sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
            rm -f /tmp/gitleaks.tar.gz /tmp/gitleaks
          fi
          gitleaks version
          gitleaks version | grep -q "${GITLEAKS_VERSION}"

      # THIS SCAN HAD BEEN SCANNING NOTHING. On this runner git refuses the checkout
      # ("detected dubious ownership"), gitleaks logs "failed to scan Git repository",
      # then "no leaks found", and exits 0 -- so secret-scan was green on every run
      # without reading a single commit (found by the SEC-5 review).
      #
      # Two fixes, both needed:
      #   - the checkout is marked a safe directory for THIS step only, through a
      #     throwaway GLOBAL config file (GIT_CONFIG_GLOBAL), rather than by editing the
      #     runner's real ~/.gitconfig. NOT via GIT_CONFIG_COUNT/-c: git before 2.38
      #     ignores command-line scope for safe.directory (the CVE-2022-24765 fix reads
      #     it with ignore_cmdline), and the runner has git 2.34.1 -- the CISO review
      #     caught that the first version of this fix could never have gone green;
      #   - the job FAILS unless gitleaks says it scanned commits and logged no error.
      #     A scanner that cannot scan must never read as a scanner that found nothing.
      - name: Run Gitleaks secret scan
        run: |
          set -uo pipefail
          export GIT_CONFIG_GLOBAL="${RUNNER_TEMP}/gitleaks-gitconfig"
          git config --file "${GIT_CONFIG_GLOBAL}" --add safe.directory "${GITHUB_WORKSPACE}"
          LOG="${RUNNER_TEMP}/gitleaks.log"
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --verbose \
            --exit-code 1 2>&1 | tee "${LOG}"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          if grep -Eq '\bERR\b|failed to scan' "${LOG}"; then
            echo "::error::gitleaks reported an error -- the scan did not run. Refusing to pass."
            exit 1
          fi
          scanned=$(grep -Eo '[0-9]+ commits scanned' "${LOG}" | grep -Eo '^[0-9]+' || echo 0)
          # Commits that CHANGE something, excluding merges: gitleaks walks `git log -p`,
          # which shows no diff for a merge or an --allow-empty commit, so neither is ever
          # counted as scanned. `-- .` drops the empty ones; without it one empty commit
          # would fail every run for good.
          expected=$(git rev-list --count --no-merges HEAD -- .)
          : "${expected:?could not count the history -- refusing to pass}"
          echo "[gitleaks] ${scanned} commits scanned; HEAD has ${expected} non-merge commits"
          # A FLOOR, not equality: gitleaks' own count runs a couple below the number of
          # commits with a diff (measured: consistently 2 fewer -- commits it has nothing
          # to scan in, e.g. only allowlisted paths or binaries). What this guards is a
          # scan that silently covered little or nothing -- an error (caught above), a
          # shallow checkout, a wrong --source -- and 90% separates those from a real run
          # by a wide margin.
          if [ "${scanned}" -lt 1 ] || [ $((scanned * 10)) -lt $((expected * 9)) ]; then
            echo "::error::gitleaks scanned ${scanned} of ${expected} commits. Refusing to pass."
            exit 1
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2: SAST — Semgrep
  # Uses the `auto` ruleset (Node.js, React, OWASP Top 10, injection, XSS, etc.)
  # plus project-specific custom rules defined in .semgrep.yml.
  # ─────────────────────────────────────────────────────────────────────────────
  semgrep:
    name: SAST — Semgrep
    runs-on: self-hosted
    # SAME-REPO ONLY. This repository is PUBLIC and every job here runs on a
    # SELF-HOSTED runner that is the production host itself -- the deploy job brings up
    # docker-compose.yaml on it and health-checks localhost:3000. Without this line a
    # `pull_request` trigger means anyone on the internet can fork, open a PR, and run
    # code beside the live database, JWT_SECRET and the LDAP bind password. A fork PR
    # skips every job instead; a branch inside this repo needs push access, which is
    # already enough to deploy, so this keeps the pre-existing trust boundary exactly
    # where it was. See the CISO note in CLAUDE.md -- the deploy guard and the image tag
    # do NOT cover this; they prevent accidents, not attacks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    continue-on-error: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # PINNED and ISOLATED, like Gitleaks and Trivy above (ROADMAP SEC-3). This was an
      # unversioned `pip3 install semgrep` behind `if ! command -v semgrep` -- so on this
      # PERSISTENT runner whatever `semgrep` came first on PATH was trusted for ever: a
      # stale version, or a stub dropped there by anything that ever ran on the host,
      # would turn SAST green permanently while CI reported success.
      #
      # Now the pinned version lives in its own directory, keyed by version, and is
      # run by ABSOLUTE PATH through a generated wrapper, never looked up on PATH. The
      # version is verified, and a mismatch fails the job. Bump SEMGREP_VERSION
      # deliberately -- it must be a real release on pypi.org/project/semgrep.
      #
      # `pip install --target`, NOT a venv: the runner has no python3-venv (ensurepip),
      # so `python3 -m venv` failed the first run of this step. The wrapper sets
      # PYTHONPATH to the pinned tree (ahead of system site-packages), disables the user
      # site, and puts the tree's own bin/ first on PATH -- semgrep execs `pysemgrep`
      # by name, and without that it found none, or whichever one PATH offered.
      - name: Install Semgrep (pinned, isolated)
        env:
          SEMGREP_VERSION: "1.178.0"
        run: |
          set -euo pipefail
          DIR="${HOME}/.cache/gametracker-semgrep/${SEMGREP_VERSION}"
          if [ "$("${DIR}/semgrep" --version 2>/dev/null || true)" != "${SEMGREP_VERSION}" ]; then
            echo "[semgrep] Installing pinned v${SEMGREP_VERSION} into ${DIR}..."
            rm -rf "${DIR}"
            mkdir -p "${DIR}"
            pip3 install --quiet --disable-pip-version-check --no-warn-script-location \
              --target "${DIR}/lib" "semgrep==${SEMGREP_VERSION}"
            printf '%s\n' '#!/bin/sh' \
              "export PYTHONPATH=\"${DIR}/lib\" PYTHONNOUSERSITE=1 PATH=\"${DIR}/lib/bin:\$PATH\"" \
              "exec python3 -s \"${DIR}/lib/bin/semgrep\" \"\$@\"" > "${DIR}/semgrep"
            chmod 755 "${DIR}/semgrep"
          fi
          # Fail closed if the binary we are about to run is not the pinned version.
          test "$("${DIR}/semgrep" --version)" = "${SEMGREP_VERSION}"
          echo "SEMGREP_BIN=${DIR}/semgrep" >> "$GITHUB_ENV"
          echo "[semgrep] Using ${DIR}/semgrep v${SEMGREP_VERSION}"

      # `--config auto` still pulls the registry's CURRENT rules: the binary is pinned,
      # the auto rule set is not (the registry does not version it). A new registry rule
      # can therefore fail a build that did not change -- that is the intended direction
      # for a security gate -- but a rule REMOVED upstream is silent. .semgrep.yml is the
      # pinned half; put anything this repo depends on there.
      - name: Run Semgrep scan
        run: |
          "${SEMGREP_BIN:?SEMGREP_BIN not set by the install step}" scan \
            --config auto \
            --config .semgrep.yml \
            --error \
            --exclude 'node_modules' \
            --exclude 'dist' \
            --exclude 'frontend/dist' \
            --exclude-rule 'javascript.lang.security.audit.unsafe-formatstring.unsafe-formatstring' \
            --exclude-rule 'javascript.express.security.audit.express-check-csurf-middleware-usage.express-check-csurf-middleware-usage' \
            .

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 3: Frontend Lint & Build (Typecheck)
  # Runs ESLint and Vite build. Vite build acts as the typecheck / compile
  # verification step since the project has no TypeScript.
  #
  # Backend unit tests now run here too (`npm test`), no longer excluded: the
  # placeholder script that exited 1 has been replaced by test/helpers.test.js.
  # ─────────────────────────────────────────────────────────────────────────────
  frontend-quality:
    name: Frontend Lint, Build & Backend Tests
    runs-on: self-hosted
    # SAME-REPO ONLY. This repository is PUBLIC and every job here runs on a
    # SELF-HOSTED runner that is the production host itself -- the deploy job brings up
    # docker-compose.yaml on it and health-checks localhost:3000. Without this line a
    # `pull_request` trigger means anyone on the internet can fork, open a PR, and run
    # code beside the live database, JWT_SECRET and the LDAP bind password. A fork PR
    # skips every job instead; a branch inside this repo needs push access, which is
    # already enough to deploy, so this keeps the pre-existing trust boundary exactly
    # where it was. See the CISO note in CLAUDE.md -- the deploy guard and the image tag
    # do NOT cover this; they prevent accidents, not attacks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    continue-on-error: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # MUST match the major in the Dockerfiles, and test/runtime.test.js fails the
      # build if it does not. This ran Node 20 while the MCP image ran node:18, so the
      # suites passed on an interpreter production never used and a server that could
      # not answer a single request shipped with every job green.
      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      # --ignore-scripts: sqlite3 is a devDependency (only the one-shot SQLite migration
      # script uses it) with no prebuilt binary here, so a plain `npm ci` would compile it
      # via node-gyp (~60s) for tests that never load it. The backend Dockerfile runs
      # `npm ci --omit=dev`, which never sees sqlite3 at all.
      - name: Install backend dependencies
        run: npm ci --ignore-scripts

      # Pure-function unit tests only (no database, no directory, no network) —
      # see the scope rule at the top of test/helpers.test.js.
      - name: Run backend unit tests
        run: npm test

      # `no-undef` above all. A refactor once deleted two `const` declarations whose
      # every reference sat inside a try/catch, so the DRM cache silently stopped
      # working for a whole deploy cycle with nothing failing. Static analysis catches
      # that class before merge; a runtime guard cannot. devDependencies never enter
      # the image (the Dockerfile runs `npm ci --omit=dev`), so this changes neither
      # the Trivy scan surface nor the image size.
      - name: Lint backend
        run: npm run lint

      # The MCP server is a separate package with its own lockfile, so it gets its own
      # install. Its suite pins the exposed TOOL INVENTORY — every tool there is
      # reachable by an AI agent acting on a real library, so adding one must be a
      # deliberate edit rather than a side effect — and asserts that the server holds
      # no credential of its own.
      - name: Install MCP dependencies
        run: npm ci --ignore-scripts
        working-directory: ./mcp

      - name: Run MCP unit tests
        run: npm test
        working-directory: ./mcp

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci --ignore-scripts

      - name: Run ESLint
        working-directory: ./frontend
        run: npm run lint

      # Component behaviour tests (Vitest + jsdom, ROADMAP UP-20). They replace source-text
      # shape pins in test/runtime.test.js one by one; devDependencies only, so nothing of
      # this reaches the nginx image.
      - name: Run frontend component tests
        working-directory: ./frontend
        run: npm test

      - name: Vite build (compile + typecheck verification)
        working-directory: ./frontend
        run: npm run build

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 4: Build Docker Images
  # Builds both backend and frontend images that are shared by the container
  # scan jobs and the smoke test.
  # ─────────────────────────────────────────────────────────────────────────────
  build-images:
    name: Build Docker Images
    runs-on: self-hosted
    # SAME-REPO ONLY. This repository is PUBLIC and every job here runs on a
    # SELF-HOSTED runner that is the production host itself -- the deploy job brings up
    # docker-compose.yaml on it and health-checks localhost:3000. Without this line a
    # `pull_request` trigger means anyone on the internet can fork, open a PR, and run
    # code beside the live database, JWT_SECRET and the LDAP bind password. A fork PR
    # skips every job instead; a branch inside this repo needs push access, which is
    # already enough to deploy, so this keeps the pre-existing trust boundary exactly
    # where it was. See the CISO note in CLAUDE.md -- the deploy guard and the image tag
    # do NOT cover this; they prevent accidents, not attacks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    continue-on-error: false
    env:
      BACKEND_IMAGE_BASE: local/gametracker-backend
      FRONTEND_IMAGE_BASE: local/gametracker-frontend
      MCP_IMAGE_BASE: local/gametracker-mcp
    outputs:
      image_tag: ${{ steps.image-tags.outputs.image_tag }}
      backend_image: ${{ steps.image-tags.outputs.backend_image }}
      frontend_image: ${{ steps.image-tags.outputs.frontend_image }}
      mcp_image: ${{ steps.image-tags.outputs.mcp_image }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # THE TAG IS THE SAFETY BOUNDARY between a pull request and production.
      #
      # `latest` is what BOTH compose files resolve, and this runner is self-hosted --
      # the same Docker daemon that runs production. A PR build tagged `latest` does not
      # disturb the RUNNING containers (they hold an image ID), but it repoints the tag,
      # so the next `docker compose up` on this host starts production on PR code. That
      # includes an operator restart and the deploy job's own stop/start.
      #
      # And NOTHING here writes `latest` -- not even on a push to main. It used to: a
      # main push was built straight to `:latest`, BEFORE Trivy and the smoke test had
      # run. A build that then failed a HIGH CVE skipped deploy, but `:latest` already
      # pointed at the rejected image, so the next restart of this host ran it anyway --
      # the PR hazard above, reached from main. (ROADMAP P0-5.)
      #
      # So every build gets a tag nothing resolves by default: `pr-<number>` for a pull
      # request, `sha-<commit>` for a push. The scans and the smoke stack test THAT tag,
      # and only the deploy job, after every gate has passed, promotes it to `latest`.
      # test/runtime.test.js fails if any job but deploy so much as mentions `:latest`.
      - name: Set image tag outputs
        id: image-tags
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            TAG="pr-${{ github.event.number }}"
          else
            TAG="sha-${GITHUB_SHA:0:12}"
          fi
          echo "image_tag=${TAG}" >> $GITHUB_OUTPUT
          echo "backend_image=${BACKEND_IMAGE_BASE}:${TAG}" >> $GITHUB_OUTPUT
          echo "frontend_image=${FRONTEND_IMAGE_BASE}:${TAG}" >> $GITHUB_OUTPUT
          echo "mcp_image=${MCP_IMAGE_BASE}:${TAG}" >> $GITHUB_OUTPUT
          echo "[build] Tagging images :${TAG} (event=${{ github.event_name }})"

      - name: Build backend Docker image
        run: |
          docker build \
            --no-cache \
            -t ${{ steps.image-tags.outputs.backend_image }} \
            .

      # --pull --no-cache: the base is a moving `alpine` tag and the Dockerfile runs
      # `apk upgrade`. Cached, both froze at whatever the runner first fetched, and
      # Trivy failed on a libexpat HIGH that Alpine had already fixed.
      - name: Build frontend Docker image
        run: |
          docker build \
            --pull \
            --no-cache \
            -t ${{ steps.image-tags.outputs.frontend_image }} \
            ./frontend

      - name: Build MCP Docker image
        run: |
          docker build \
            -t ${{ steps.image-tags.outputs.mcp_image }} \
            ./mcp

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 5: Container Scan — Backend / API (Trivy)
  # Scans the backend image for known CVEs. Fails on CRITICAL or HIGH severity
  # unfixed vulnerabilities. Depends on build-images.
  # ─────────────────────────────────────────────────────────────────────────────
  trivy-api:
    name: Container Scan — API / Backend (Trivy)
    runs-on: self-hosted
    # SAME-REPO ONLY. This repository is PUBLIC and every job here runs on a
    # SELF-HOSTED runner that is the production host itself -- the deploy job brings up
    # docker-compose.yaml on it and health-checks localhost:3000. Without this line a
    # `pull_request` trigger means anyone on the internet can fork, open a PR, and run
    # code beside the live database, JWT_SECRET and the LDAP bind password. A fork PR
    # skips every job instead; a branch inside this repo needs push access, which is
    # already enough to deploy, so this keeps the pre-existing trust boundary exactly
    # where it was. See the CISO note in CLAUDE.md -- the deploy guard and the image tag
    # do NOT cover this; they prevent accidents, not attacks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    continue-on-error: false
    needs: build-images
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Pinned release tarball, verified before use. The previous version piped
      # raw.githubusercontent.com/.../main/contrib/install.sh into `sudo sh` — a
      # mutable ref executed as root on the same host that runs production and holds
      # JWT_SECRET. It was also guarded by `if ! command -v trivy`, so on a
      # persistent runner anyone who could drop a stub at /usr/local/bin/trivy would
      # permanently green-light the scan while CI still reported success.
      - name: Install Trivy (pinned)
        env:
          # Must be a REAL release tag — verify at github.com/aquasecurity/trivy/releases
          # before changing. The asset is trivy_<ver>_Linux-64bit.tar.gz (capital L, hyphen).
          # 0.70.0 is what this runner already has, so the pin normally downloads nothing.
          TRIVY_VERSION: "0.70.0"
        run: |
          set -euo pipefail
          if [ "$(trivy --version 2>/dev/null | head -1 | awk '{print $2}')" != "${TRIVY_VERSION}" ]; then
            echo "[trivy] Installing pinned v${TRIVY_VERSION}..."
            curl -sSfL --proto '=https' --tlsv1.2 \
              "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
              -o /tmp/trivy.tar.gz
            tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
            sudo install -m 0755 /tmp/trivy /usr/local/bin/trivy
            rm -f /tmp/trivy.tar.gz /tmp/trivy
          fi
          # Fail closed if the binary on PATH is not the pinned version.
          trivy --version
          trivy --version | head -1 | grep -q "${TRIVY_VERSION}"

      - name: Scan backend image
        env:
          TRIVY_DISABLE_VEX_NOTICE: "true"
        run: |
          trivy image \
            --exit-code 1 \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --no-progress \
            --format table \
            --ignorefile .trivyignore \
            ${{ needs.build-images.outputs.backend_image }}

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 6: Container Scan — Frontend / Web (Trivy)
  # Scans the frontend (nginx + React SPA) image for known CVEs.
  # Fails on CRITICAL or HIGH severity unfixed vulnerabilities.
  # ─────────────────────────────────────────────────────────────────────────────
  trivy-web:
    name: Container Scan — Web / Frontend (Trivy)
    runs-on: self-hosted
    # SAME-REPO ONLY. This repository is PUBLIC and every job here runs on a
    # SELF-HOSTED runner that is the production host itself -- the deploy job brings up
    # docker-compose.yaml on it and health-checks localhost:3000. Without this line a
    # `pull_request` trigger means anyone on the internet can fork, open a PR, and run
    # code beside the live database, JWT_SECRET and the LDAP bind password. A fork PR
    # skips every job instead; a branch inside this repo needs push access, which is
    # already enough to deploy, so this keeps the pre-existing trust boundary exactly
    # where it was. See the CISO note in CLAUDE.md -- the deploy guard and the image tag
    # do NOT cover this; they prevent accidents, not attacks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    continue-on-error: false
    needs: build-images
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Pinned release tarball, verified before use. The previous version piped
      # raw.githubusercontent.com/.../main/contrib/install.sh into `sudo sh` — a
      # mutable ref executed as root on the same host that runs production and holds
      # JWT_SECRET. It was also guarded by `if ! command -v trivy`, so on a
      # persistent runner anyone who could drop a stub at /usr/local/bin/trivy would
      # permanently green-light the scan while CI still reported success.
      - name: Install Trivy (pinned)
        env:
          # Must be a REAL release tag — verify at github.com/aquasecurity/trivy/releases
          # before changing. The asset is trivy_<ver>_Linux-64bit.tar.gz (capital L, hyphen).
          # 0.70.0 is what this runner already has, so the pin normally downloads nothing.
          TRIVY_VERSION: "0.70.0"
        run: |
          set -euo pipefail
          if [ "$(trivy --version 2>/dev/null | head -1 | awk '{print $2}')" != "${TRIVY_VERSION}" ]; then
            echo "[trivy] Installing pinned v${TRIVY_VERSION}..."
            curl -sSfL --proto '=https' --tlsv1.2 \
              "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
              -o /tmp/trivy.tar.gz
            tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
            sudo install -m 0755 /tmp/trivy /usr/local/bin/trivy
            rm -f /tmp/trivy.tar.gz /tmp/trivy
          fi
          # Fail closed if the binary on PATH is not the pinned version.
          trivy --version
          trivy --version | head -1 | grep -q "${TRIVY_VERSION}"

      - name: Scan frontend image
        env:
          TRIVY_DISABLE_VEX_NOTICE: "true"
        run: |
          trivy image \
            --exit-code 1 \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --no-progress \
            --format table \
            --ignorefile .trivyignore \
            ${{ needs.build-images.outputs.frontend_image }}

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 6b: Container Scan — MCP (Trivy)
  # The MCP image ships to production alongside the others, so it is scanned on the
  # same terms. An image in the deployment that no scan job covers is a hole the
  # pipeline would report as green.
  #
  # It is built from node:22-slim, NOT the node:18-slim the backend still uses — the
  # MCP SDK requires globalThis.crypto, which Node 18 does not expose. Worth knowing
  # about this job's green result either way: Trivy reads dpkg metadata, and the Node
  # runtime in the official images is a tarball rather than a package, so no Trivy job
  # here sees CVEs in the interpreter itself. Passing is not evidence about the Node
  # version; only the base tag is.
  # ─────────────────────────────────────────────────────────────────────────────
  trivy-mcp:
    name: Container Scan — MCP (Trivy)
    runs-on: self-hosted
    # SAME-REPO ONLY. This repository is PUBLIC and every job here runs on a
    # SELF-HOSTED runner that is the production host itself -- the deploy job brings up
    # docker-compose.yaml on it and health-checks localhost:3000. Without this line a
    # `pull_request` trigger means anyone on the internet can fork, open a PR, and run
    # code beside the live database, JWT_SECRET and the LDAP bind password. A fork PR
    # skips every job instead; a branch inside this repo needs push access, which is
    # already enough to deploy, so this keeps the pre-existing trust boundary exactly
    # where it was. See the CISO note in CLAUDE.md -- the deploy guard and the image tag
    # do NOT cover this; they prevent accidents, not attacks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    continue-on-error: false
    needs: build-images
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Pinned release tarball, verified before use. The previous version piped
      # raw.githubusercontent.com/.../main/contrib/install.sh into `sudo sh` — a
      # mutable ref executed as root on the same host that runs production and holds
      # JWT_SECRET. It was also guarded by `if ! command -v trivy`, so on a
      # persistent runner anyone who could drop a stub at /usr/local/bin/trivy would
      # permanently green-light the scan while CI still reported success.
      - name: Install Trivy (pinned)
        env:
          # Must be a REAL release tag — verify at github.com/aquasecurity/trivy/releases
          # before changing. The asset is trivy_<ver>_Linux-64bit.tar.gz (capital L, hyphen).
          # 0.70.0 is what this runner already has, so the pin normally downloads nothing.
          TRIVY_VERSION: "0.70.0"
        run: |
          set -euo pipefail
          if [ "$(trivy --version 2>/dev/null | head -1 | awk '{print $2}')" != "${TRIVY_VERSION}" ]; then
            echo "[trivy] Installing pinned v${TRIVY_VERSION}..."
            curl -sSfL --proto '=https' --tlsv1.2 \
              "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
              -o /tmp/trivy.tar.gz
            tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
            sudo install -m 0755 /tmp/trivy /usr/local/bin/trivy
            rm -f /tmp/trivy.tar.gz /tmp/trivy
          fi
          # Fail closed if the binary on PATH is not the pinned version.
          trivy --version
          trivy --version | head -1 | grep -q "${TRIVY_VERSION}"

      - name: Scan MCP image
        env:
          TRIVY_DISABLE_VEX_NOTICE: "true"
        run: |
          trivy image \
            --exit-code 1 \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --no-progress \
            --format table \
            --ignorefile .trivyignore \
            ${{ needs.build-images.outputs.mcp_image }}

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 7: Smoke Test (docker compose)
  # Starts a completely isolated test stack using docker-compose.test.yml. Verifies backend /api/health and frontend HTTP 200
  # before any deploy happens. Teardown always runs (if: always()).
  #
  # ISOLATION GUARANTEES:
  #   - Compose project: gametracker-smoke-<main|pr>-<run_id>-<attempt>, one per run
  #     (separate network + containers; no container_name is fixed)
  #   - Ports: 3099/8099/3199 for pull requests, 3098/8098/3198 for main -- no
  #     conflict with production 3000/8080/3001, nor with each other
  #   - Data dir: a mktemp -d under RUNNER_TEMP -- never touches production data
  #   - Dummy API keys — no real credentials used or exposed
  # ─────────────────────────────────────────────────────────────────────────────
  smoke-test:
    name: Smoke Test (docker compose)
    runs-on: self-hosted
    # SAME-REPO ONLY. This repository is PUBLIC and every job here runs on a
    # SELF-HOSTED runner that is the production host itself -- the deploy job brings up
    # docker-compose.yaml on it and health-checks localhost:3000. Without this line a
    # `pull_request` trigger means anyone on the internet can fork, open a PR, and run
    # code beside the live database, JWT_SECRET and the LDAP bind password. A fork PR
    # skips every job instead; a branch inside this repo needs push access, which is
    # already enough to deploy, so this keeps the pre-existing trust boundary exactly
    # where it was. See the CISO note in CLAUDE.md -- the deploy guard and the image tag
    # do NOT cover this; they prevent accidents, not attacks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    continue-on-error: false
    needs:
      - build-images
      - secret-scan
      - semgrep
      - frontend-quality
    # PARTITIONED BY EVENT (ROADMAP UP-6). Within a partition the host ports are fixed, so
    # two of the same kind must never overlap -- the group serialises them. ACROSS
    # partitions they may run at once: the project name is per run and the ports differ.
    # The point is that a pull request can never cancel a queued main run's smoke-test
    # (and with it that merge's deploy), which a single shared group allowed.
    concurrency:
      group: gametracker-smoke-stack-${{ github.event_name == 'push' && 'main' || 'pr' }}
      cancel-in-progress: false
    env:
      SMOKE_PARTITION: ${{ github.event_name == 'push' && 'main' || 'pr' }}
      SMOKE_PROJECT: gametracker-smoke-${{ github.event_name == 'push' && 'main' || 'pr' }}-${{ github.run_id }}-${{ github.run_attempt }}
      BACKEND_TEST_PORT: ${{ github.event_name == 'push' && '3098' || '3099' }}
      FRONTEND_TEST_PORT: ${{ github.event_name == 'push' && '8098' || '8099' }}
      MCP_TEST_PORT: ${{ github.event_name == 'push' && '3198' || '3199' }}
      # The images THIS run built. Both compose files default these to `:latest`, so a
      # by-hand `docker compose up` is unchanged; CI passes them explicitly because on a
      # pull request the tag is `pr-<number>` and `:latest` is production's, not ours.
      # Without this the smoke stage would test whatever happened to be tagged latest on
      # the runner -- i.e. the last thing MERGED, not the change under review.
      TEST_BACKEND_IMAGE: ${{ needs.build-images.outputs.backend_image }}
      TEST_FRONTEND_IMAGE: ${{ needs.build-images.outputs.frontend_image }}
      TEST_MCP_IMAGE: ${{ needs.build-images.outputs.mcp_image }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # SMOKE_DATA_DIR is created with mktemp -d, not a fixed /tmp path.
      #
      # The old fixed path (/tmp/gametracker-smoke-data) on a shared, persistent
      # runner was a symlink-attack target: any local user could pre-create it as a
      # symlink to /home/docker/gametracker/data, at which point this step's `echo`
      # truncated the production settings.json, `chmod -R 777` exposed the live
      # database, and teardown's `rm -rf` DELETED the production data directory.
      - name: Prepare ephemeral test data directory
        run: |
          set -euo pipefail
          SMOKE_DATA_DIR="$(mktemp -d "${RUNNER_TEMP:-/tmp}/gametracker-smoke.XXXXXXXX")"
          echo "SMOKE_DATA_DIR=${SMOKE_DATA_DIR}" >> "$GITHUB_ENV"
          # No gametracker.db any more — the smoke stack brings up its own
          # throwaway Postgres container and the backend creates the schema.
          echo '{}' > "${SMOKE_DATA_DIR}/settings.json"
          echo '[]' > "${SMOKE_DATA_DIR}/sent_notifications.json"
          # mktemp -d already creates the directory 0700. Only ownership needs
          # changing, for the container's UID 1000 (node). Do NOT chmod after the
          # chown — under `set -e` that would fail the job whenever the runner's
          # own UID is not 1000.
          sudo chown -R 1000:1000 "${SMOKE_DATA_DIR}"
          echo "[smoke] Test data dir: ${SMOKE_DATA_DIR}"

      # A stack a cancelled or crashed run left behind would hold THIS partition's ports.
      # Only this partition's projects are removed: the concurrency group guarantees none
      # of them belongs to a live run, while the other partition's may well be running.
      - name: Remove leftover smoke stacks from this partition
        run: |
          set -euo pipefail
          for proj in $(docker compose ls -a -q | grep -E "^gametracker-smoke-${SMOKE_PARTITION}-[0-9]+-[0-9]+$" || true); do
            echo "[smoke] Removing leftover stack ${proj}"
            docker compose -p "${proj}" -f docker-compose.test.yml down --volumes --remove-orphans || true
          done

      - name: Start smoke test stack
        env:
          IGDB_CLIENT_ID: smoke-test-dummy
          IGDB_BEARER_TOKEN: smoke-test-dummy
          RAWG_API_KEY: smoke-test-dummy
          JWT_SECRET: smoke-test-jwt-secret-not-real
        run: |
          docker compose \
            -p "${SMOKE_PROJECT}" \
            -f docker-compose.test.yml \
            up -d || {
            echo "[smoke] ERROR: Stack failed to start — printing backend container logs:"
            docker compose -p "${SMOKE_PROJECT}" -f docker-compose.test.yml logs --no-color backend 2>&1 || true
            exit 1
          }
          echo "[smoke] Stack started — backend :${{ env.BACKEND_TEST_PORT }}, frontend :${{ env.FRONTEND_TEST_PORT }}"

      - name: Wait for backend to become healthy
        run: |
          MAX_WAIT=60
          ELAPSED=0
          until curl -sf http://localhost:${{ env.BACKEND_TEST_PORT }}/api/health > /dev/null 2>&1; do
            if [ "$ELAPSED" -ge "$MAX_WAIT" ]; then
              echo "[smoke] ERROR: Backend not healthy after ${MAX_WAIT}s"
              docker compose -p "${SMOKE_PROJECT}" -f docker-compose.test.yml logs backend
              exit 1
            fi
            echo "[smoke] Waiting for backend... (${ELAPSED}s)"
            sleep 5
            ELAPSED=$((ELAPSED + 5))
          done
          echo "[smoke] Backend healthy after ${ELAPSED}s"

      - name: Verify backend health response
        run: |
          RESPONSE=$(curl -sf http://localhost:${{ env.BACKEND_TEST_PORT }}/api/health)
          echo "[smoke] Response: $RESPONSE"
          echo "$RESPONSE" | grep -q '"status":"ok"' || {
            echo "[smoke] ERROR: Unexpected response — expected {\"status\":\"ok\"}"
            exit 1
          }
          echo "[smoke] Backend health check PASSED"

      - name: Wait for frontend to become reachable
        run: |
          MAX_WAIT=30
          ELAPSED=0
          until curl -sf http://localhost:${{ env.FRONTEND_TEST_PORT }}/ > /dev/null 2>&1; do
            if [ "$ELAPSED" -ge "$MAX_WAIT" ]; then
              echo "[smoke] ERROR: Frontend not reachable after ${MAX_WAIT}s"
              docker compose -p "${SMOKE_PROJECT}" -f docker-compose.test.yml logs frontend
              exit 1
            fi
            echo "[smoke] Waiting for frontend... (${ELAPSED}s)"
            sleep 3
            ELAPSED=$((ELAPSED + 3))
          done
          echo "[smoke] Frontend reachable after ${ELAPSED}s"

      - name: Verify frontend returns HTTP 200
        run: |
          STATUS=$(curl -o /dev/null -sw "%{http_code}" http://localhost:${{ env.FRONTEND_TEST_PORT }}/)
          echo "[smoke] Frontend HTTP status: $STATUS"
          [ "$STATUS" -eq 200 ] || {
            echo "[smoke] ERROR: Expected HTTP 200, got $STATUS"
            exit 1
          }
          echo "[smoke] Frontend HTTP 200 check PASSED"

      # THE check that actually matters: the browser talks to the API through
      # nginx on the frontend port, never to the backend port directly. Until the
      # nginx /api proxy existed, `try_files` answered /api/* with index.html and
      # HTTP 200 — so the check above passed against a completely broken stack.
      # Asserting the JSON body here is what makes that failure mode visible.
      - name: Verify API is reachable THROUGH the frontend proxy
        run: |
          set -euo pipefail
          RESPONSE=$(curl -sf "http://localhost:${{ env.FRONTEND_TEST_PORT }}/api/health")
          echo "[smoke] /api/health via frontend: $RESPONSE"
          echo "$RESPONSE" | grep -q '"status":"ok"' || {
            echo "[smoke] ERROR: /api/health through the frontend proxy did not return status ok."
            echo "[smoke] If this returned HTML, the nginx /api proxy is not routing to the backend."
            exit 1
          }
          echo "[smoke] End-to-end frontend -> backend check PASSED"

      # An unmatched /api path must be JSON 404, not the SPA's index.html —
      # otherwise a typo'd endpoint surfaces in the app as a JSON parse error.
      - name: Verify unknown API routes return JSON 404
        run: |
          set -euo pipefail
          STATUS=$(curl -o /tmp/smoke-404.json -sw "%{http_code}" \
            "http://localhost:${{ env.FRONTEND_TEST_PORT }}/api/definitely-not-a-route")
          echo "[smoke] Unknown API route status: $STATUS, body: $(cat /tmp/smoke-404.json)"
          [ "$STATUS" -eq 404 ] && grep -q '"error"' /tmp/smoke-404.json || {
            echo "[smoke] ERROR: expected a JSON 404 from an unknown /api route."
            exit 1
          }
          rm -f /tmp/smoke-404.json
          echo "[smoke] API 404 handling check PASSED"

      # Status history, against the real Postgres, inside the real backend container.
      #
      # This cannot be a unit test. The five statements in services/library.js that
      # write user_games.status are the whole foundation of the statistics feature, and
      # stubbing db.promises proves only that a statement was issued — not that a row
      # landed, that the CHECK constraints accept it, that the release sweep's CTE fires
      # only when it moved something, or that `source` came out right.
      #
      # It earns a CI slot rather than being a by-hand script because a regression here
      # is PERMANENTLY destructive: history that was never written cannot be backfilled,
      # and migrations 004 and 005 both refuse to invent timestamps. Every silent day
      # costs data no later fix recovers.
      #
      # upsert-release-date covers D7, and specifically the half of that fix that NO
      # unit test can reach: `release_date=excluded.release_date` in the ON CONFLICT DO
      # UPDATE list. The parameter bound to the INSERT is identical whether or not that
      # clause is present, so only a database can say which row came out. Verified by
      # deleting the clause: the integration test fails and the whole unit suite stays
      # green.
      #
      # reminders runs three release sweeps at ONCE and asserts one send: the reminder
      # log is a primary-key claim in Postgres now (migration 006). The JSON file it
      # replaced sent three.
      #
      # email-resolution proves only DIRECTORY accounts are looked up in LDAP for a
      # missing email: a local account used to be given, and have WRITTEN to its row,
      # the address of whoever held the same username in the directory (CC-5).
      #
      # migration-lock asks pg_locks whether the schema-migration advisory lock outlived
      # its run, and starts a second process migrating: the lock used to stay on a
      # pooled connection, blocking every later migrator (CC-7).
      - name: Verify status history, statistics and the upsert's date rule (real Postgres)
        run: |
          set -euo pipefail
          for t in status-events stats upsert-release-date reminders email-resolution migration-lock; do
            docker compose -p "${SMOKE_PROJECT}" -f docker-compose.test.yml \
              exec -T backend node "test/integration/${t}.test.js" || {
              echo "[smoke] ERROR: ${t} integration test failed"
              docker compose -p "${SMOKE_PROJECT}" -f docker-compose.test.yml logs --no-color backend 2>&1 | tail -30 || true
              exit 1
            }
          done
          echo "[smoke] Status history + statistics + upsert date-rule checks PASSED"

      # The statistics route THROUGH EXPRESS, which nothing else exercises.
      #
      # Both integration tests above call services directly, so every adapter between
      # the socket and the service — authRequired, ownershipRequired, withExistingUser,
      # problem.send — ships unexercised. CLAUDE.md says exactly this about
      # api-contract.test.js ("it cannot see the Express adapters") and names the smoke
      # stage as the fix; this is that fix, for the one route added here.
      #
      # The 401 is the assertion that matters most. A route silently losing its
      # authorization middleware still returns 200 to an authenticated caller, so a
      # happy-path check alone would not notice.
      - name: Verify the statistics route through Express
        run: |
          set -euo pipefail
          BASE="http://127.0.0.1:${{ env.BACKEND_TEST_PORT }}"

          UNAUTH=$(curl -o /dev/null -sw "%{http_code}" "$BASE/api/user/root/stats")
          echo "[smoke] unauthenticated GET /api/user/root/stats -> $UNAUTH"
          [ "$UNAUTH" -eq 401 ] || {
            echo "[smoke] ERROR: the stats route answered $UNAUTH without a token, expected 401."
            echo "[smoke] authRequired is not on this route."
            exit 1
          }

          TOKEN=$(curl -sf -X POST "$BASE/api/auth/login" \
            -H 'content-type: application/json' \
            -d '{"username":"root","password":"smoke-test-root-not-a-real-password"}' \
            | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
          [ -n "$TOKEN" ] || { echo "[smoke] ERROR: could not log in as root"; exit 1; }

          STATUS=$(curl -o /tmp/smoke-stats.json -sw "%{http_code}" \
            -H "Authorization: Bearer $TOKEN" "$BASE/api/user/root/stats")
          echo "[smoke] authenticated GET -> $STATUS: $(head -c 200 /tmp/smoke-stats.json)"
          [ "$STATUS" -eq 200 ] || {
            echo "[smoke] ERROR: authenticated stats request returned $STATUS"
            docker compose -p "${SMOKE_PROJECT}" -f docker-compose.test.yml logs --no-color backend 2>&1 | tail -30 || true
            exit 1
          }
          # Shape, not just a 200 — an empty body or an HTML error page is also a 200
          # from some proxies, and the page renders a missing field as a confident zero.
          for key in coverage completions durations trackingSince inProgress; do
            grep -q "\"$key\"" /tmp/smoke-stats.json || {
              echo "[smoke] ERROR: stats response is missing \"$key\""
              exit 1
            }
          done
          rm -f /tmp/smoke-stats.json

          # The per-game history, through Express. UNAUTHENTICATED FIRST: this route
          # returns one user's play history, and a route that loses its middleware still
          # answers 200 to an authenticated caller -- so a happy-path check alone would
          # not notice.
          HUNAUTH=$(curl -o /dev/null -sw "%{http_code}" "$BASE/api/user/root/games/igdb_smoke/history")
          echo "[smoke] unauthenticated GET .../history -> $HUNAUTH"
          [ "$HUNAUTH" -eq 401 ] || {
            echo "[smoke] ERROR: the history route answered $HUNAUTH without a token, expected 401."
            exit 1
          }
          HSTATUS=$(curl -o /tmp/smoke-hist.json -sw "%{http_code}" \
            -H "Authorization: Bearer $TOKEN" "$BASE/api/user/root/games/igdb_smoke/history")
          echo "[smoke] authenticated GET .../history -> $HSTATUS: $(head -c 160 /tmp/smoke-hist.json)"
          [ "$HSTATUS" -eq 200 ] || {
            echo "[smoke] ERROR: history request returned $HSTATUS"
            exit 1
          }
          # A game with no recorded transitions is an EMPTY history, never a 404 -- the
          # normal case for anything added before migration 005.
          for key in events daysToFinish gameId; do
            grep -q "\"$key\"" /tmp/smoke-hist.json || {
              echo "[smoke] ERROR: history response is missing \"$key\""
              exit 1
            }
          done
          rm -f /tmp/smoke-hist.json
          echo "[smoke] Statistics + history route checks PASSED"

      # A real MCP handshake against the real container, on the image's own Node.
      #
      # This is the check that was missing. The MCP server shipped a full deploy cycle
      # answering `ReferenceError: crypto is not defined` to every call, and nothing
      # noticed: `npm test` runs on the RUNNER's Node 20 where globalThis.crypto exists,
      # the image ran node:18-slim where it does not, and the container was not in this
      # stack at all. /health returned 200 the whole time — which is exactly why a
      # liveness probe is not enough for a protocol server. Speak the protocol.
      #
      # The token is a fake. `initialize` is answered by the transport and never reaches
      # the API, so a valid one would prove nothing extra; what is under test is that the
      # server can complete an exchange at all.
      - name: Verify the MCP server completes an initialize handshake
        run: |
          set -euo pipefail
          # Liveness first, so a slow start is reported as a slow start rather than as a
          # protocol failure. It proves nothing on its own — that is the entire lesson
          # here — but it makes the handshake result below unambiguous.
          ELAPSED=0
          until curl -sf "http://127.0.0.1:${{ env.MCP_TEST_PORT }}/health" > /dev/null 2>&1; do
            if [ "$ELAPSED" -ge 30 ]; then
              echo "[smoke] ERROR: MCP container never became reachable"
              docker compose -p "${SMOKE_PROJECT}" -f docker-compose.test.yml logs --no-color mcp 2>&1 | tail -30 || true
              exit 1
            fi
            sleep 3
            ELAPSED=$((ELAPSED + 3))
          done
          echo "[smoke] MCP reachable after ${ELAPSED}s"

          BODY='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"smoke","version":"0"}}}'
          STATUS=$(curl -o /tmp/smoke-mcp.txt -sw "%{http_code}" \
            -X POST "http://127.0.0.1:${{ env.MCP_TEST_PORT }}/mcp" \
            -H 'content-type: application/json' \
            -H 'accept: application/json, text/event-stream' \
            -H 'authorization: Bearer gt_pat_smoke-test-not-a-real-token' \
            -d "$BODY")
          echo "[smoke] MCP initialize status: $STATUS"
          echo "[smoke] MCP initialize body: $(head -c 400 /tmp/smoke-mcp.txt)"
          [ "$STATUS" -eq 200 ] || {
            echo "[smoke] ERROR: MCP initialize returned $STATUS, expected 200."
            docker compose -p "${SMOKE_PROJECT}" -f docker-compose.test.yml logs --no-color mcp 2>&1 | tail -30 || true
            exit 1
          }
          # A JSON-RPC error is delivered with HTTP 200 in some paths, so the status
          # code alone would not have caught the crypto failure. Assert the RESULT.
          grep -q '"serverInfo"' /tmp/smoke-mcp.txt && grep -q '"name":"gametracker"' /tmp/smoke-mcp.txt || {
            echo "[smoke] ERROR: MCP initialize did not return a serverInfo result."
            docker compose -p "${SMOKE_PROJECT}" -f docker-compose.test.yml logs --no-color mcp 2>&1 | tail -30 || true
            exit 1
          }
          grep -q '"error"' /tmp/smoke-mcp.txt && {
            echo "[smoke] ERROR: MCP initialize returned a JSON-RPC error."
            exit 1
          } || true
          rm -f /tmp/smoke-mcp.txt
          echo "[smoke] MCP handshake check PASSED"

      # END TO END with a REAL credential (ROADMAP UP-7). Every step above is v1, and the
      # MCP handshake uses a fake PAT because `initialize` never reaches the backend. So
      # nothing proved that a token minted by create-api-token.js is accepted by /api/v2,
      # that a v2 WRITE lands, or that the MCP server forwards a caller's token to the
      # backend — the whole design of both. This mints one inside the throwaway stack
      # (scopes library,admin, expires in a day, stack destroyed at teardown anyway),
      # masks it in the log, and drives both paths.
      - name: Verify /api/v2 and the MCP-to-backend path with a real token
        run: |
          set -euo pipefail
          B="http://127.0.0.1:${{ env.BACKEND_TEST_PORT }}"
          M="http://127.0.0.1:${{ env.MCP_TEST_PORT }}"
          fail() { echo "[smoke] ERROR: $1"; docker compose -p "${SMOKE_PROJECT}" -f docker-compose.test.yml logs --no-color backend mcp 2>&1 | tail -40 || true; exit 1; }

          # The token is printed ALONE on stdout (the script's contract); prose goes to stderr.
          # `|| true`: under set -e + pipefail a failed mint would kill the step SILENTLY;
          # the case below reports it with the script's own stderr instead.
          PAT=$(docker compose -p "${SMOKE_PROJECT}" -f docker-compose.test.yml exec -T backend \
                  node create-api-token.js root "smoke-e2e-${GITHUB_RUN_ID:-local}-$$" library,admin --expires-in-days 1 \
                  2>/tmp/smoke-mint.err | tail -n 1) || true
          case "$PAT" in gt_pat_*) ;; *) fail "create-api-token.js did not print a token: $(tail -n 3 /tmp/smoke-mint.err 2>/dev/null)" ;; esac
          echo "::add-mask::${PAT}"

          # 1. v2 refuses a missing credential with problem+json 401 (never the v1 envelope).
          CODE=$(curl -s -o /tmp/smoke-v2.json -w "%{http_code} %{content_type}" "$B/api/v2/library/games")
          case "$CODE" in "401 application/problem+json"*) ;; *) fail "unauthenticated v2 answered: $CODE" ;; esac

          # 2. A v2 READ with the minted token.
          CODE=$(curl -s -o /tmp/smoke-v2.json -w "%{http_code}" -H "Authorization: Bearer $PAT" "$B/api/v2/library/games?limit=5")
          [ "$CODE" = "200" ] && grep -q '"data"' /tmp/smoke-v2.json || fail "v2 library read answered $CODE: $(head -c 300 /tmp/smoke-v2.json)"

          # 3. A v2 WRITE that needs no external provider (no API keys here): replace the
          #    outgoing share list, then read it back through the same token.
          CODE=$(curl -s -o /tmp/smoke-v2.json -w "%{http_code}" -X PUT -H "Authorization: Bearer $PAT" \
                   -H 'content-type: application/json' -d '{"usernames":[]}' "$B/api/v2/shares/outgoing")
          [ "$CODE" = "200" ] && grep -q '"data":\[\]' /tmp/smoke-v2.json || fail "v2 share write answered $CODE: $(head -c 300 /tmp/smoke-v2.json)"

          # 4. An MCP TOOL CALL that reaches the backend: whoami can only answer with the
          #    caller's identity if the MCP server forwarded this token and v2 accepted it.
          curl -s -o /tmp/smoke-mcp-e2e.txt -X POST "$M/mcp" -H 'content-type: application/json' \
               -H 'accept: application/json, text/event-stream' -H "authorization: Bearer $PAT" \
               -d '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"whoami","arguments":{}}}'
          grep -q 'username\\":\\"root' /tmp/smoke-mcp-e2e.txt || fail "MCP whoami did not return the token's user: $(head -c 400 /tmp/smoke-mcp-e2e.txt)"
          grep -q '"isError":true' /tmp/smoke-mcp-e2e.txt && fail "MCP whoami returned a tool error" || true

          rm -f /tmp/smoke-v2.json /tmp/smoke-mcp-e2e.txt
          echo "[smoke] v2 read, v2 write and MCP -> backend with a real token PASSED"

      - name: Tear down smoke test stack
        if: always()
        env:
          IGDB_CLIENT_ID: smoke-test-dummy
          IGDB_BEARER_TOKEN: smoke-test-dummy
          RAWG_API_KEY: smoke-test-dummy
          JWT_SECRET: smoke-test-jwt-secret-not-real
        run: |
          docker compose \
            -p "${SMOKE_PROJECT}" \
            -f docker-compose.test.yml \
            down --volumes --remove-orphans || true
          # Refuse to delete anything that isn't the mktemp -d directory we created.
          if [ -n "${SMOKE_DATA_DIR:-}" ] && [ -d "${SMOKE_DATA_DIR}" ] && [ ! -L "${SMOKE_DATA_DIR}" ]; then
            sudo rm -rf --one-file-system "${SMOKE_DATA_DIR}"
          fi
          echo "[smoke] Stack torn down and temp data wiped"

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 8: Deploy to Production
  # ONLY runs when ALL 8 upstream jobs pass.
  # Uses docker image prune -f (dangling only) to preserve layer cache.
  # ─────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: self-hosted
    continue-on-error: false
    # THE GUARD. Until pull_request was added to the triggers, this job was protected
    # only by the fact that the workflow could not run on anything but a push to main --
    # there is no ref check anywhere else in this file. Deleting this line does not fail
    # any test; it deploys pull requests to production.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # One deploy at a time, and never cancel one midway: `docker compose up` on the
    # production stack is not safe to interrupt.
    concurrency:
      group: gametracker-deploy
      cancel-in-progress: false
    needs:
      - secret-scan
      - semgrep
      - frontend-quality
      - build-images
      - trivy-api
      - trivy-web
      - trivy-mcp
      - smoke-test
    env:
      BACKEND_IMAGE_BASE: local/gametracker-backend
      FRONTEND_IMAGE_BASE: local/gametracker-frontend
      MCP_IMAGE_BASE: local/gametracker-mcp
      # PINNED EXPLICITLY, not left to the compose defaults. docker-compose.yaml now reads
      # ${BACKEND_IMAGE:-...:latest}, and compose picks up a `.env` sitting next to it in
      # the project directory -- which is exactly where README tells operators to put one.
      # A stray BACKEND_IMAGE=...:pr-42 there would otherwise send a PR image to
      # production on the next `up`. Naming them here means the deploy cannot inherit one.
      BACKEND_IMAGE: local/gametracker-backend:latest
      FRONTEND_IMAGE: local/gametracker-frontend:latest
      MCP_IMAGE: local/gametracker-mcp:latest
      # JOB level, unlike the secrets below, precisely BECAUSE these are not secrets.
      # They were repeated across three steps to keep them symmetric; repetition is the
      # weakest way to enforce a symmetry requirement, and a job-level binding makes the
      # drift structurally impossible instead of conventionally discouraged.
      #
      # The secrets stay STEP-scoped on purpose: a job-level env is also visible to
      # actions/checkout@v4, and a third-party action has no need for JWT_SECRET.
      MCP_BIND: ${{ vars.MCP_BIND || secrets.MCP_BIND }}
      MCP_ALLOWED_HOSTS: ${{ vars.MCP_ALLOWED_HOSTS || secrets.MCP_ALLOWED_HOSTS }}
      # The backend's non-secret settings, for the same reason: compose runs from this
      # job's fresh checkout and never sees the host's `.env`. TRUST_PROXY and
      # BACKEND_BIND are the README's hardened topology — set in `.env` alone, the next
      # push to main silently redeployed at trust-proxy 1 on 0.0.0.0, the exact
      # lockout-everyone failure that topology exists to prevent. test/runtime.test.js
      # fails when a variable docker-compose.yaml interpolates is missing from this job.
      BACKEND_BIND: ${{ vars.BACKEND_BIND || secrets.BACKEND_BIND }}
      TRUST_PROXY: ${{ vars.TRUST_PROXY || secrets.TRUST_PROXY }}
      CORS_ORIGINS: ${{ vars.CORS_ORIGINS || secrets.CORS_ORIGINS }}
      STEAM_REGION: ${{ vars.STEAM_REGION || secrets.STEAM_REGION }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # PROMOTION -- the only place in this workflow that writes `latest` (P0-5).
      #
      # The images were built and scanned as `sha-<commit>`. Every gate this job needs
      # has passed, so they become `latest` here and nowhere earlier. Whatever `latest`
      # was is kept as `previous` first: that is what the rollback step below restores
      # when the new stack fails to come up (SEC-6).
      #
      # `has_previous` is written BEFORE the retag loop, so a failure partway through
      # the loop still leaves the rollback step able to put all three back.
      #
      # There is deliberately NO `docker compose down` before `up` any more. It stopped
      # the whole stack -- database included -- before the new one was even started, so
      # every deploy was an outage and a failed one stayed an outage. `up -d` replaces
      # only the containers whose image changed, and the database keeps running.
      - name: Promote the scanned images to :latest
        id: promote
        env:
          IMAGE_TAG: ${{ needs.build-images.outputs.image_tag }}
        run: |
          set -euo pipefail
          case "${IMAGE_TAG}" in
            sha-*) ;;
            *) echo "[deploy] Refusing to promote '${IMAGE_TAG}': expected sha-<commit>."; exit 1 ;;
          esac
          BASES="${BACKEND_IMAGE_BASE} ${FRONTEND_IMAGE_BASE} ${MCP_IMAGE_BASE}"
          # All three must exist BEFORE anything is retagged. The cleanup job keeps a
          # push run's tags until a deploy succeeds, so "Re-run failed jobs" finds them;
          # if they are gone anyway, re-run the whole workflow.
          for base in ${BASES}; do
            docker image inspect "${base}:${IMAGE_TAG}" >/dev/null 2>&1 || {
              echo "[deploy] ${base}:${IMAGE_TAG} not found. Re-run the WHOLE workflow, not only this job."
              exit 1
            }
          done
          HAS_PREVIOUS=true
          for base in ${BASES}; do
            if docker image inspect "${base}:latest" >/dev/null 2>&1; then
              docker tag "${base}:latest" "${base}:previous"
            else
              HAS_PREVIOUS=false
            fi
          done
          # NOTE: re-running a whole workflow that already deployed (same commit) makes
          # `previous` the image that is already live, so a failure there has nothing
          # older to roll back to. Harmless, but not a real rollback target.
          echo "has_previous=${HAS_PREVIOUS}" >> "$GITHUB_OUTPUT"
          for base in ${BASES}; do
            docker tag "${base}:${IMAGE_TAG}" "${base}:latest"
            echo "[deploy] ${base}:${IMAGE_TAG} -> :latest"
          done
          echo "[deploy] Rollback target recorded: has_previous=${HAS_PREVIOUS}"

      # TRUST_PROXY and BACKEND_BIND are only safe as a PAIR (ROADMAP UP-17), and the
      # backend cannot check it: the bind is a host-side port mapping it never sees.
      #   TRUST_PROXY>=2 with the backend still on 0.0.0.0: a client connecting straight
      #     to :3000 supplies its own X-Forwarded-For and walks past the login limiter.
      #   BACKEND_BIND=127.0.0.1 with TRUST_PROXY=1: every request arrives from nginx, so
      #     req.ip is nginx for everyone and one person's failures lock out all users.
      # A WARNING, not a failure: a proxy on another machine legitimately needs 0.0.0.0,
      # and refusing to deploy over a config choice would take the site down to make a point.
      - name: Check the reverse-proxy pairing (TRUST_PROXY / BACKEND_BIND)
        run: |
          tp="${TRUST_PROXY:-1}"; bind="${BACKEND_BIND:-0.0.0.0}"
          case "$tp" in ''|*[!0-9]*) echo "::warning title=TRUST_PROXY::TRUST_PROXY is not a number. index.js reads it with Number(), so a value like loopback, true or a CIDR becomes NaN and Express then trusts NO proxy hop: every request appears to come from nginx and one user's failed logins lock everyone out. Use a hop count (1, or 2 behind the frontend's nginx)."; exit 0 ;; esac
          loopback=false; case "$bind" in 127.*|localhost|::1|'[::1]') loopback=true ;; esac
          if [ "$tp" -ge 2 ] && [ "$loopback" = false ]; then
            echo "::warning title=Reverse proxy pairing::TRUST_PROXY=${tp} but the backend is published on ${bind}. A client reaching port 3000 directly can spoof X-Forwarded-For past the login rate limiter. Set BACKEND_BIND=127.0.0.1 (README: Reverse proxy topology)."
          elif [ "$tp" -le 1 ] && [ "$loopback" = true ]; then
            echo "::warning title=Reverse proxy pairing::BACKEND_BIND=${bind} with TRUST_PROXY=${tp}: every request arrives through nginx, so the login limiter sees one client and a single user's failures lock out everyone. Set TRUST_PROXY=2."
          else
            echo "[deploy] Reverse-proxy pairing OK: TRUST_PROXY=${tp}, BACKEND_BIND=${bind}"
          fi

      - name: Start production stack
        # MCP_BIND / MCP_ALLOWED_HOSTS are repository VARIABLES by preference — a LAN
        # address is not a credential, and a secret is masked in the logs where the
        # whole point is being able to read back which interface was published.
        #
        # `vars.X || secrets.X` because the two live on adjacent tabs of the same
        # settings page under near-identical forms, and putting it on the wrong one
        # fails SILENTLY: `vars.MCP_BIND` resolves to empty, compose takes its
        # loopback default, every job goes green and the only symptom is a port
        # binding nobody looks at. That already cost one full deploy cycle. Reading
        # both means the setting works wherever it was put; the log line below still
        # says which interface won, and prints `***` if it came from a secret.
        #
        # They must be HERE and not only in a host-side `.env`: this job runs
        # actions/checkout into a fresh workspace, so compose reads the checked-out
        # directory and never sees a `.env` sitting next to the running stack. That is
        # exactly how MCP kept coming back on 127.0.0.1 after MCP_BIND was implemented
        # — the setting was correct, the deploy simply never carried it, and compose's
        # `${MCP_BIND:-127.0.0.1}` default silently applied.
        #
        # Unset is the safe case: an empty value is not a value to `:-`, so compose
        # still defaults to loopback.
        env:
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_BEARER_TOKEN: ${{ secrets.IGDB_BEARER_TOKEN }}
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          THEGAMESDB_API_KEY: ${{ secrets.THEGAMESDB_API_KEY }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
        run: |
          # The `|| { ... }` is REQUIRED now that frontend and mcp declare
          # `depends_on: backend: condition: service_healthy`. Before that, `up -d`
          # returned as soon as the containers were created and a failed migration
          # surfaced in the NEXT step, which dumps 50 lines of backend log. With the
          # health gate, `up -d` itself fails and that step never runs — so the deploy
          # would report one line of compose text where it used to report the actual
          # error. That diagnostic exists because it once masked a
          # `password authentication failed`; do not let the ordering fix delete it.
          docker compose -f docker-compose.yaml up -d --remove-orphans || {
            echo "[deploy] ERROR: stack failed to start (backend never became healthy?)"
            docker logs --tail 50 gametracker-backend-1 2>&1 || true
            docker compose -f docker-compose.yaml ps || true
            exit 1
          }
          # Print what MCP was actually published on. `docker ps` after a deploy is the
          # only way anyone noticed the default was in force; printing it here means the
          # deploy log answers "which interface?" without a shell on the host.
          #
          # ALLOWED_HOSTS is echoed too: it is the DNS-rebinding allowlist, it is now
          # settable from a repository variable with no commit and no diff, and a
          # security control that leaves no trace in the deploy record is one nobody
          # can audit after the fact.
          echo "[deploy] MCP_BIND=${MCP_BIND:-127.0.0.1} (unset => loopback only)"
          echo "[deploy] MCP_ALLOWED_HOSTS=${MCP_ALLOWED_HOSTS:-<none, defaults only>}"
          docker compose -f docker-compose.yaml port mcp "${MCP_PORT:-3001}" || true
          # WHICH IMAGES production actually started on, for the same reason. The compose
          # files resolve ${BACKEND_IMAGE:-...:latest}, so the answer is no longer a
          # constant you can read off the file -- it depends on the environment this job
          # ran with, and a deploy record that cannot answer "what went live?" is the
          # thing the pinning above only half fixes. `config --images` is the RESOLVED
          # answer rather than an echo of what we think we set.
          echo "[deploy] images (resolved from the compose file, not from intent):"
          docker compose -f docker-compose.yaml config --images | sed 's/^/[deploy]   /'

      # env is needed even though this step starts nothing: the failure path runs
      # `docker compose logs`, which interpolates the compose file. Without it the
      # diagnostic dies on `POSTGRES_PASSWORD is missing` and MASKS the real reason
      # the backend is unhealthy — which is exactly what happened on the first
      # Postgres deploy, hiding a `password authentication failed` behind it.
      - name: Verify production deployment health
        env:
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_BEARER_TOKEN: ${{ secrets.IGDB_BEARER_TOKEN }}
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          THEGAMESDB_API_KEY: ${{ secrets.THEGAMESDB_API_KEY }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
        run: |
          echo "[deploy] Waiting for production backend to become healthy..."
          MAX_WAIT=90
          ELAPSED=0
          until curl -sf http://localhost:3000/api/health > /dev/null 2>&1; do
            if [ "$ELAPSED" -ge "$MAX_WAIT" ]; then
              echo "[deploy] ERROR: Production backend not healthy after ${MAX_WAIT}s"
              # `docker logs` by container name, NOT `docker compose logs` — it talks
              # to the daemon directly and cannot fail on compose interpolation, so
              # the diagnostic still works even when the compose file will not render.
              docker logs --tail 50 gametracker-backend-1 2>&1 || \
                docker compose -f docker-compose.yaml logs --tail 50 backend || true
              exit 1
            fi
            sleep 5
            ELAPSED=$((ELAPSED + 5))
          done
          echo "[deploy] Production healthy after ${ELAPSED}s — deployment SUCCESSFUL"

      # ROLLBACK (SEC-6). Runs when promotion, start-up or the health check failed,
      # and there was a `latest` to go back to. It restores `previous` -> `latest` and
      # brings that stack up again. The JOB STAYS FAILED either way: a rolled-back
      # deploy is a failed deploy, and it must read as one.
      #
      # What it cannot undo: a schema migration the new backend already applied.
      # Migrations are additive and the runner only applies files it knows, so the
      # previous backend boots on a newer schema -- but a migration that removes or
      # renames something the previous code reads would break that. Write migrations
      # so the previous release still runs on them.
      #
      # `cancelled()` too: a deploy cancelled by hand between promote and a healthy
      # start would otherwise leave `latest` on the new images, or the stack half-replaced.
      - name: Roll back to the previous images
        if: (failure() || cancelled()) && steps.promote.outputs.has_previous == 'true'
        env:
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_BEARER_TOKEN: ${{ secrets.IGDB_BEARER_TOKEN }}
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          THEGAMESDB_API_KEY: ${{ secrets.THEGAMESDB_API_KEY }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
          IMAGE_TAG: ${{ needs.build-images.outputs.image_tag }}
        run: |
          set -uo pipefail
          echo "::error::Deploy of ${IMAGE_TAG} failed. Rolling production back to the previous images."
          for base in ${BACKEND_IMAGE_BASE} ${FRONTEND_IMAGE_BASE} ${MCP_IMAGE_BASE}; do
            docker tag "${base}:previous" "${base}:latest"
          done
          docker compose -f docker-compose.yaml up -d --remove-orphans || true
          ELAPSED=0
          until curl -sf http://localhost:3000/api/health > /dev/null 2>&1; do
            if [ "$ELAPSED" -ge 90 ]; then
              echo "::error::ROLLBACK FAILED: the previous images are not healthy either. Production is DOWN."
              docker logs --tail 50 gametracker-backend-1 2>&1 || true
              exit 1
            fi
            sleep 5
            ELAPSED=$((ELAPSED + 5))
          done
          echo "::warning::Rolled back: production is healthy on the PREVIOUS images. ${IMAGE_TAG} did NOT go live."
          docker compose -f docker-compose.yaml config --images | sed 's/^/[rollback]   /'
          # KNOWN LIMIT: if this release changed a NETWORK definition in the compose
          # file, `up` without `down` fails -- here and in the start step. Recovery is
          # manual: `docker compose -f docker-compose.yaml down` (never --volumes),
          # then `up -d`.

      - name: Prune dangling Docker images
        run: |
          docker image prune -f
          echo "[deploy] Dangling image prune complete"

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 9: Remove this run's image tags (pr-<number>, and since P0-5 sha-<commit>)
  # The job id is still `cleanup-pr-images`, kept to avoid renaming a check.
  # PR builds are tagged pr-<number> so they can never be mistaken for production's
  # :latest. Nothing else ever deletes them: the deploy job's prune is
  # `docker image prune -f`, which removes DANGLING images only, and these carry a
  # tag. One set of three images per pull request accumulates on a self-hosted runner
  # that has already failed a build once with "You don't have enough free space in
  # /var/cache/apt/archives/".
  #
  # A SEPARATE JOB, not a step in smoke-test. The three Trivy jobs and smoke-test all
  # depend only on build-images, so they run CONCURRENTLY — deleting the images from
  # inside smoke-test's teardown would pull them out from under a scan that is still
  # running. This waits for every consumer.
  #
  # `if: always()` because a failed run leaves images behind exactly like a passing
  # one does, and that is the case where nobody comes back to tidy up.
  # ─────────────────────────────────────────────────────────────────────────────
  #
  # PUSH RUNS TOO, since P0-5: a main build is tagged `sha-<commit>` now. It waits for
  # `deploy`, so it never untags an image before promotion has read it. A push run that
  # did NOT deploy keeps its tags (so "Re-run failed jobs" still has images to scan and
  # promote); the next successful deploy sweeps every leftover sha-* tag.
  cleanup-pr-images:
    name: Clean up this run's image tags
    runs-on: self-hosted
    if: always() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    needs:
      - build-images
      - trivy-api
      - trivy-web
      - trivy-mcp
      - smoke-test
      - deploy
    steps:
      - name: Remove this run's image tags
        env:
          TAG: ${{ needs.build-images.outputs.image_tag }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          set -euo pipefail
          BASES="local/gametracker-backend local/gametracker-frontend local/gametracker-mcp"
          # Only pr-<number> or sha-<commit>. NEVER latest or previous -- those are
          # production and its rollback target. If the output is missing (build-images
          # never ran) an unguarded `docker rmi ...:` would be a malformed reference.
          case "${TAG}" in
            pr-*|sha-*) ;;
            *) echo "[cleanup] Refusing to remove tag '${TAG}' — expected pr-<number> or sha-<commit>."; exit 0 ;;
          esac
          if [ "${TAG#sha-}" != "${TAG}" ]; then
            # A PUSH run keeps its images unless it DEPLOYED. "Re-run failed jobs" re-runs
            # the scans and deploy but not build-images, so removing sha-<commit> after a
            # transient scan failure (a rate-limited Trivy DB download, say) made the
            # re-run fail on a missing image and forced a full rebuild.
            if [ "${DEPLOY_RESULT}" != "success" ]; then
              echo "[cleanup] Deploy result '${DEPLOY_RESULT}': keeping :${TAG} so 'Re-run failed jobs' still works."
              echo "[cleanup] The next successful deploy removes it."
              exit 0
            fi
            # Deployed: remove EVERY sha-* tag, not only ours. Whole main runs are
            # serialised by the workflow concurrency group, so no other main run is in
            # flight -- any other sha-* tag was left by an earlier run that never
            # deployed. After promotion this run's image is also :latest, so removing
            # its sha tag drops the tag and keeps the image.
            for base in ${BASES}; do
              for ref in $(docker images --format '{{.Repository}}:{{.Tag}}' "${base}" | grep ':sha-' || true); do
                docker rmi "${ref}" >/dev/null 2>&1 \
                  && echo "[cleanup] Removed ${ref}" \
                  || echo "[cleanup] Could not remove ${ref} (in use?)"
              done
            done
          else
            for base in ${BASES}; do
              docker rmi "${base}:${TAG}" 2>/dev/null \
                && echo "[cleanup] Removed ${base}:${TAG}" \
                || echo "[cleanup] ${base}:${TAG} already gone"
            done
          fi
          docker image prune -f >/dev/null 2>&1 || true
          echo "[cleanup] Image tag cleanup complete"
