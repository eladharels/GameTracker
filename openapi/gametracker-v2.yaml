# This document is the SOURCE for the /api/v2 routes, not a description of them.
#
# Operations carrying `x-implemented: true` are LIVE, and test/api-surface.test.js
# enforces both directions against the running router: an implemented operation with
# no route is a published lie, and a v2 route with no implemented operation is
# undocumented surface. Everything else here is still a specification to be built.
#
# See API_V2_DESIGN.md for the decisions behind each choice.

openapi: 3.1.0

info:
  title: GameTracker API
  version: 2.0.0
  summary: Self-hosted game library — v2
  description: |
    The second-generation GameTracker API. Designed for the owner's own scripts and for
    an MCP server, not as a public API.

    **v1 (`/api`) is frozen and permanently supported.** It is not deprecated and emits no
    `Sunset` header: the Android companion app is a build this project does not control.
    v2 is a redesign, not a migration deadline. v1 remains documented in `README.md`.

    ## What is different from v1, and why

    Each of these fixes something that made v1 hard or unsafe to drive programmatically.
    v1's shapes are preserved in v1 and corrected only here.

    * **Errors are RFC 9457 `application/problem+json`** and carry a stable machine
      `code`. v1 returned `{"error": "some text"}`, so a client could only branch by
      string-matching a human message.
    * **Lists return `{data, meta}`.** v1 signalled a degraded catalog search in an
      `X-Catalog-Degraded` header while the body stayed a bare array; generated clients
      drop headers, so "a provider is down" and "no such game" read identically. That
      distinction now lives in `meta.degraded`, in the body.
    * **camelCase everywhere, once.** v1 emitted snake_case *plus* duplicated
      `steamAppId`/`crackStatus` aliases, and search used a third convention again.
    * **Mutations are falsifiable.** v1 returned `{"success": true}` from a `DELETE` that
      matched no row and from a reorder that moved nothing. Combined with opaque game
      ids, a typo was a silent no-op reported as success — the worst possible shape for
      an LLM-driven client. Here a `DELETE` that matched nothing is a `404`.
    * **Status is derived from the STORED release date.** In v1 the status was computed
      from the `releaseDate` in the request body, so omitting it for an already-released
      game silently rewrote the row to `unreleased` and made the next correct write
      announce a six-year-old game as newly released, to every notification channel.
    * **Long operations are jobs**, not requests that a reverse proxy kills at minute two.

    ## Authentication

    v2 accepts **personal access tokens only**. There is no login endpoint — minting the
    first credential cannot itself require a credential, so tokens are created with
    `create-api-token.js` inside the backend container:

    ```
    docker compose -f docker-compose.yaml exec backend \
      node create-api-token.js <username> "mcp" library
    ```

    Send it as `Authorization: Bearer gt_pat_...`.

    A 12-hour session JWT from v1's `POST /api/auth/login` is **not** accepted here. That
    is deliberate rather than tidiness: a JWT carries no scope, so honouring one would
    make the admin boundary below bypassable by logging in with a password.

    ## Scopes

    Two, and a scope may only ever **narrow** the privilege the account already has —
    it can never grant. An `admin`-scoped token held by a non-admin is not an admin; a
    `library`-scoped token held by an administrator is not one either, for that request.

    | Scope | Grants |
    |---|---|
    | `library` | Everything that is not administration: the caller's own library, backlog, catalog search, sharing, notification settings, and their own tokens. |
    | `admin` | Additionally: user management and server settings, including API keys. |

    `library` is a slightly narrow name for "everything that is not admin" — it is not
    read-only, and it is not restricted to the library. A `library` token can change the
    account's own notification targets and share its library with another user. What it
    cannot do is manage users or read server configuration.

    **Every** operation declares its scope with `x-required-scope`, `library` or `admin`.
    That extension exists because an OpenAPI `security` scope array carries defined
    semantics only for `oauth2`/`openIdConnect`; on an HTTP bearer scheme 3.1 permits
    role names there but leaves them "not otherwise defined or exchanged in-band", so
    declaring scopes that way would be decorative — no generator enforces it, no client
    honours it. `x-required-scope` is checked in CI against the authorization tier
    derived from the live Express router.

    The marker is mandatory rather than "present when admin": making `library` the mere
    absence of a marker would make a FORGOTTEN marker indistinguishable from a
    deliberate one.

    ## Privilege is re-read on every request

    Nothing is cached in the credential. Demoting or deleting an account takes effect on
    that account's tokens on their very next call, and deleting a user removes their
    tokens with it. Revocation is deleting one row — which is the whole reason tokens are
    looked up rather than self-describing.
  contact:
    name: GameTracker
    url: https://github.com/eladharels/GameTracker
  license:
    name: MIT

servers:
  - url: /api/v2
    description: Same origin as the SPA — the frontend nginx proxies /api to the backend.

security:
  - bearerAuth: []

tags:
  - name: identity
    description: Who this credential is, and what it may do.
  - name: tokens
    description: Personal access tokens. A caller may only ever see and revoke their own.
  - name: library
    description: The caller's game library and backlog ordering.
  - name: catalog
    description: Search across IGDB, RAWG and TheGamesDB.
  - name: sharing
    description: Read-only sharing of a library with named users.
  - name: admin
    description: User management and server settings. Requires the `admin` scope.
  - name: jobs
    description: Long-running work, accepted with 202 and polled.

paths:

  # ---------------------------------------------------------------- identity --
  /me:
    get:
      tags: [identity]
      operationId: getMe
      x-implemented: true
      x-required-scope: library
      summary: Identity and effective privilege for this credential
      description: |
        One call to orient a client: who the token belongs to, what it may actually do
        *after* scope narrowing, and when it expires. `canManageUsers` is the effective
        value — an administrator using a `library`-scoped token sees `false`.
      responses:
        '200':
          description: The authenticated identity.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/notifications:
    get:
      tags: [identity]
      operationId: getMyNotificationSettings
      x-implemented: true
      x-required-scope: library
      summary: Where this account's notifications go
      description: |
        The caller's OWN delivery settings. These are bearer secrets that address the
        user's devices — an ntfy topic, a Gotify application token, a Telegram chat id —
        and they are readable here **only** because this is the caller's own row.

        No administrator can read or write them for another account, on any operation in
        this API. v1 returned two of them for every user to every admin until that was
        fixed, and the fix is the reason `User` carries none of these fields.
      responses:
        '200':
          description: This account's delivery settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [identity]
      operationId: updateMyNotificationSettings
      x-implemented: true
      x-required-scope: library
      summary: Change where this account's notifications go
      description: |
        Partial. Server URLs are validated against the cloud instance-metadata blocklist
        at the SEND sink rather than here, so that the check also covers values that
        predate it — do not move it and delete it there.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationSettingsUpdate' }
      responses:
        '200':
          description: The updated settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationSettings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ------------------------------------------------------------------ tokens --
  /tokens:
    get:
      tags: [tokens]
      operationId: listTokens
      x-implemented: true
      x-required-scope: library
      summary: List this account's tokens
      description: |
        The secret is never returned — only `hint`, the last four characters, which is
        what lets an operator match a token in a config file against the row they are
        about to revoke.
      responses:
        '200':
          description: This account's tokens, oldest first.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Token' }
                additionalProperties: false
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [tokens]
      operationId: createToken
      x-implemented: true
      x-required-scope: library
      summary: Mint a token
      description: |
        **The secret is returned exactly once, in this response, and is not recoverable.**
        Only its SHA-256 hash is stored, so neither this API nor the database can produce
        it again.

        **A token may not mint a token carrying any scope the PRESENTING CREDENTIAL does
        not itself hold.** A `library`-scoped token can mint only `library`-scoped tokens.
        Minting an `admin`-scoped token requires both an `admin`-scoped credential *and*
        an account with administrator permission — scope narrowing is re-applied here, so
        a credential can never bootstrap itself upward.

        The bound is the credential, not the account. Bounding it by the account would
        make this operation an escape hatch out of the entire scope system: the
        `library`-scoped token handed to the MCP — the least-trusted consumer in this
        design — would mint itself an `admin` token and be an administrator one call
        later.

        Tokens are always minted for the caller. `TokenCreate` carries no user reference,
        deliberately: there is no way to mint a credential for another account.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TokenCreate' }
      responses:
        '201':
          description: Created. Contains the only copy of the secret.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: |
            The presenting credential does not hold every requested scope, or the account
            does not have administrator permission for an `admin`-scoped request.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: This account already has a token with that name. Names are unique per user so a revocation list is unambiguous.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /tokens/{tokenId}:
    parameters:
      - name: tokenId
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    delete:
      tags: [tokens]
      operationId: revokeToken
      x-implemented: true
      x-required-scope: library
      summary: Revoke a token
      description: |
        Takes effect on that token's next request. Scoped to the caller's own tokens: an
        id belonging to another account is a `404`, never a silent success.
      responses:
        '204':
          description: Revoked.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ----------------------------------------------------------------- library --
  /library/games:
    get:
      tags: [library]
      operationId: listLibraryGames
      x-implemented: true
      x-required-scope: library
      summary: The caller's library
      description: |
        Filtered, sorted and paginated **server-side**. "What is in my backlog, in order"
        must not mean shipping an entire library through a model's context window.

        **Ordering is total, always.** Every sort is applied as
        `ORDER BY <key> NULLS LAST, id` — the `id` tiebreaker is not optional. Three of
        the four sort keys are non-unique and two are nullable, and keyset pagination
        over a non-unique or nullable column silently produces duplicated and missing
        rows. `NULLS LAST` is stated explicitly because Postgres and SQLite disagree on
        the default, and this data outlived a migration between them.

        **The cursor pins the query.** It encodes `(sort, order, status, lastKey, lastId)`.
        Sending a cursor whose embedded parameters disagree with the query parameters is
        a `400 validation`, never a silently different result set — that mismatch is what
        a client hits the first time it changes sort while paging.

        `sort=backlogOrder` is only meaningful together with `status=backlog`; any other
        combination is a `400`.

        `meta.total` is always present, which costs a second count per page. At this
        scale that is the right trade, but it is a promise: it cannot quietly become
        optional.
      parameters:
        - name: status
          in: query
          description: Return only games in this status.
          schema: { $ref: '#/components/schemas/GameStatus' }
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, releaseDate, backlogOrder, addedAt]
            default: name
        - name: order
          in: query
          schema: { type: string, enum: [asc, desc], default: asc }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          description: |
            Opaque cursor from `meta.nextCursor`.

            Server-generated and validated on receipt; a malformed or non-matching cursor
            is a `400`. It is **never trusted as an authorization input** — the underlying
            query is scoped to the caller regardless of what the cursor contains. "Opaque"
            is a request to the client, not a control.

            `maxLength` is 1024, not a tighter bound: the cursor embeds the sort key it
            resumes from, so sorting by name carries the game name verbatim and a title
            of ~84 characters already exceeds 200. A generated client with request
            validation would refuse to send back the cursor this server had just issued.
            The bound exists only to cap what gets parsed.
          schema: { type: string, maxLength: 1024 }
      responses:
        '200':
          description: A page of library games.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/LibraryGame' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
                additionalProperties: false
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [library]
      operationId: addLibraryGame
      x-implemented: true
      x-required-scope: library
      summary: Add a game, by id or by name
      description: |
        Accepts **either** a resolved `gameId` **or** a `name`.

        Given a name, the server runs the same catalog search and exact-match rule the
        rest of the application uses. On a unique exact match it creates the game and
        returns it. Otherwise it returns **409 with the candidates** — it never guesses.
        That collapses search-then-add into one call and makes ambiguity a refusal rather
        than a wrong write.

        The match rule lives on the server, not in the client, so a script, the MCP and
        the web app all get the same answer to "which search result is this game".

        Idempotent by `gameId`: re-adding a game already in the library updates it rather
        than failing, which is what makes a retried tool call safe.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LibraryGameCreate' }
      responses:
        '200':
          description: The game was already in the library and has been updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibraryGame' }
        '201':
          description: Added.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibraryGame' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: |
            The name did not resolve to exactly one game. `candidates` holds what was
            found; resolve it client-side and retry with a `gameId`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/AmbiguousGameProblem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '502':
          description: No catalog provider answered, so "not found" could not be distinguished from "unreachable".
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /library/games/{gameId}:
    parameters:
      - name: gameId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/GameRef' }
    get:
      tags: [library]
      operationId: getLibraryGame
      x-implemented: true
      x-required-scope: library
      summary: One game from the caller's library
      description: |
        v1 had no per-game read outside a route literally named `/api/debug/`, so reading
        one game meant fetching the entire library.
      responses:
        '200':
          description: The game.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibraryGame' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [library]
      operationId: updateLibraryGame
      x-implemented: true
      x-required-scope: library
      summary: Update a game's status or metadata
      description: |
        Partial. Only the fields present in the body are written.

        There is deliberately no `backlogOrder` here. Writing one row's absolute position
        reintroduces duplicate positions, which make the reorder operation a permanent
        no-op — every writer of that column takes one advisory lock precisely to prevent
        it. Reordering goes through `PUT /library/backlog`, which is a set operation.

        **Status is re-derived from the STORED release date**, never from a date in this
        request. This is the fix for v1's worst trap: there, sending a status without a
        `releaseDate` for an already-released game wrote the row as `unreleased` while
        keeping the stored date, and the next correct write then announced the game as
        newly released to every notification channel. The web app never tripped it
        because it always resent the date; a script is exactly the client that would not.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LibraryGameUpdate' }
      responses:
        '200':
          description: The updated game.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibraryGame' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [library]
      operationId: removeLibraryGame
      x-implemented: true
      x-required-scope: library
      summary: Remove a game from the library
      description: |
        A `404` when no such game is in the library. v1 answered `{"success": true}`
        either way, so a mistyped id was a silent no-op reported as a success.
      responses:
        '204':
          description: Removed.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /library/backlog:
    get:
      tags: [library]
      operationId: getBacklog
      x-implemented: true
      x-required-scope: library
      summary: The backlog, in display order
      responses:
        '200':
          description: Backlog entries in order.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/BacklogEntry' }
                additionalProperties: false
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [library]
      operationId: replaceBacklogOrder
      x-implemented: true
      x-required-scope: library
      summary: Replace the backlog order
      description: |
        Bulk by design — ordering genuinely is a set operation, and applying it as a
        sequence of moves would leave a half-ordered list on any failure. Applied in one
        transaction under an advisory lock, so concurrent reorders serialise instead of
        deadlocking.

        Ids not in the caller's library match nothing and are ignored; `meta.updated`
        reports how many rows actually moved, so a caller can notice.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order]
              properties:
                order:
                  type: array
                  description: Game ids in the desired order, first to last.
                  items: { $ref: '#/components/schemas/GameRef' }
                  maxItems: 1000
              additionalProperties: false
      responses:
        '200':
          description: Applied.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/BacklogEntry' }
                  meta: { $ref: '#/components/schemas/ReorderMeta' }
                additionalProperties: false
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /library/refresh:
    post:
      tags: [library]
      operationId: refreshMyLibrary
      x-implemented: true
      x-required-scope: library
      summary: Re-fetch metadata for the caller's own library
      description: |
        Accepted, not performed — this walks every game in the caller's library against
        up to three providers and would be killed by any reverse proxy if run inline.

        Scoped to the caller. The instance-wide sweeps live on `POST /jobs` and are
        admin-only; keeping them separate is what stops "refresh my library" from
        silently becoming "refresh everyone's", which is what a single `kind` enum on an
        admin-only operation would have done.
      responses:
        '202':
          description: Accepted. Poll `GET /jobs/{jobId}`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
          headers:
            Location:
              description: The job resource to poll.
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: A refresh is already running for this account.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }

  # ----------------------------------------------------------------- catalog --
  /catalog/search:
    get:
      tags: [catalog]
      operationId: searchCatalog
      x-implemented: true
      x-required-scope: library
      summary: Search IGDB, RAWG and TheGamesDB
      description: |
        Providers are queried concurrently and the results merged and de-duplicated. A
        provider that is unavailable contributes zero results rather than failing the
        search — but it **reports that it is down**, in `meta`.

        That distinction is the point. If "IGDB is unreachable" and "no such game" read
        the same, a client — an LLM-driven one especially — will confidently report that
        a game does not exist during an outage. Check `meta.degraded` before concluding
        anything from an empty `data`.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 20, default: 20 }
      responses:
        '200':
          description: |
            Merged results. May be empty with `meta.degraded: true`, which means "we could
            not ask everyone", not "there is no such game".
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/CatalogGame' }
                  meta: { $ref: '#/components/schemas/SearchMeta' }
                additionalProperties: false
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '502':
          description: |
            **No provider answered** — every one either failed or is not configured on
            this instance. Distinguished from an empty result on purpose: `[]` means
            "asked, nobody had it", and only a provider that actually answered can
            establish that.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ----------------------------------------------------------------- sharing --
  /shares:
    get:
      tags: [sharing]
      operationId: listShares
      x-implemented: true
      x-required-scope: library
      summary: Who this account shares with, and who shares with it
      responses:
        '200':
          description: Both directions.
          content:
            application/json:
              schema:
                type: object
                required: [outgoing, incoming]
                properties:
                  outgoing:
                    type: array
                    description: Accounts this library is shared WITH.
                    items: { $ref: '#/components/schemas/Share' }
                  incoming:
                    type: array
                    description: Accounts that share THEIR library with this one.
                    items: { $ref: '#/components/schemas/Share' }
                additionalProperties: false
        '401': { $ref: '#/components/responses/Unauthorized' }

  /shares/outgoing:
    put:
      tags: [sharing]
      operationId: replaceOutgoingShares
      x-implemented: true
      x-required-scope: library
      summary: Replace the whole outgoing share list
      description: |
        Replaces. Anyone not named here loses access.

        v1 spelled this `POST` while giving it replace semantics, so an agent "adding a
        share" by posting one name silently revoked every other one. `PUT` says what it
        does; use `POST` to add a single user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [usernames]
              properties:
                usernames:
                  type: array
                  items: { $ref: '#/components/schemas/Username' }
                  maxItems: 200
              additionalProperties: false
      responses:
        '200':
          description: The resulting outgoing list.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Share' }
                additionalProperties: false
        '400':
          description: One or more usernames do not exist. None of the change is applied.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/UnknownUsersProblem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      tags: [sharing]
      operationId: addOutgoingShare
      x-implemented: true
      x-required-scope: library
      summary: Share with one more user
      description: Additive. Sharing with someone already on the list is a no-op, not an error.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username: { $ref: '#/components/schemas/Username' }
              additionalProperties: false
      responses:
        '201':
          description: Shared.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Share' }
        '400':
          description: No such user.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/UnknownUsersProblem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /shares/outgoing/{username}:
    parameters:
      - name: username
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Username' }
    delete:
      tags: [sharing]
      operationId: removeOutgoingShare
      x-implemented: true
      x-required-scope: library
      summary: Stop sharing with one user
      description: |
        The `404` is decided purely by whether a share row was deleted — never by whether
        the named account exists. Otherwise this becomes a username oracle for any
        authenticated caller.
      responses:
        '204':
          description: Revoked.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /shares/incoming/{username}/games:
    parameters:
      - name: username
        in: path
        required: true
        description: The account whose library is being read.
        schema: { $ref: '#/components/schemas/Username' }
      - name: limit
        in: query
        schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      - name: cursor
        in: query
        description: See `listLibraryGames` — same cursor rules, same total ordering.
        schema: { type: string, maxLength: 1024 }
    get:
      tags: [sharing]
      operationId: getSharedLibrary
      x-implemented: true
      x-required-scope: library
      # The ONE operation where being an administrator grants nothing. A shared library
      # is a consent relationship between two users, not a resource the server owns.
      # Expressed as an extension rather than left in prose so the drift gate can assert
      # the route's middleware chain carries no admin-bypassing ownership check.
      x-admin-bypass: false
      summary: Read a library shared with this account
      description: |
        Read-only, and only if that account currently shares with the caller. Revoking a
        share takes effect immediately.

        Administrators get no bypass here — this is the one place in the API where being
        an admin does not grant access, because a shared library is a consent
        relationship between two users rather than a resource the server owns.
      responses:
        '200':
          description: That account's library.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/LibraryGame' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
                additionalProperties: false
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: That account does not share with you. Deliberately indistinguishable in body from a library that does not exist.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ------------------------------------------------------------------- admin --
  /users:
    get:
      tags: [admin]
      operationId: listUsers
      x-implemented: true
      summary: All accounts
      x-required-scope: admin
      description: |
        Deliberately excludes every per-user notification target — ntfy topic, Gotify
        token, Telegram chat id and the two server URLs. Those are bearer secrets that
        address a user's devices; no administrative function needs them, and v1 returned
        two of them for every user to every admin until that was fixed.
      responses:
        '200':
          description: All accounts.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/User' }
                additionalProperties: false
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [admin]
      operationId: createUser
      x-implemented: true
      summary: Create an account
      x-required-scope: admin
      description: |
        Cannot set another user's notification targets — those are the user's own, set by
        them. Sending one is a `400`, not a silent drop: an admin tool told the write
        succeeded when it did not has been told something false.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserCreate' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: That username is taken, or is reserved.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /users/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    patch:
      tags: [admin]
      operationId: updateUser
      x-implemented: true
      summary: Update an account
      x-required-scope: admin
      description: |
        Partial. Refuses to remove the caller's own administrator permission — an
        instance that locks itself out has no way back in short of a shell on the host.
        Notification targets are refused here for the same reason as on create.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdate' }
      responses:
        '200':
          description: The updated account.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [admin]
      operationId: deleteUser
      x-implemented: true
      summary: Delete an account
      x-required-scope: admin
      description: |
        Refuses self-deletion and refuses to delete the seeded `root` account. The
        account's shares and API tokens go with it.
      responses:
        '204':
          description: Deleted.
        '400':
          description: Refused — you cannot delete your own account, or `root`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /settings:
    get:
      tags: [admin]
      operationId: getSettings
      x-implemented: true
      summary: Server configuration
      x-required-scope: admin
      description: |
        Secrets are **masked**, never returned in full, even to an administrator.

        A non-admin gets `403`. v1 returned `{}` with a `200`, which for a browser was
        harmless and for a programmatic client is a correctness hole: `{}` cannot be
        told apart from "this server has no SMTP configured", so an agent reasoning over
        the response will confidently state something false about the system.
      responses:
        '200':
          description: Configuration, with secrets masked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MaskedSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      tags: [admin]
      operationId: updateSettings
      x-implemented: true
      summary: Update server configuration
      x-required-scope: admin
      description: |
        Partial, per section: keys absent from a section are left alone rather than
        deleted, so a client that read a masked value and wrote it back does not
        overwrite the real secret with asterisks.

        Refused outright if the settings file could not be read — writing a merge on top
        of a failed load would erase every credential on the instance.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SettingsUpdate' }
      responses:
        '200':
          description: The updated configuration, masked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MaskedSettings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: |
            Settings could not be read, so the write is refused rather than merged on top
            of defaults — which would erase every credential on the instance. `code` is
            `settings_unreadable`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # -------------------------------------------------------------------- jobs --
  /jobs:
    post:
      tags: [jobs]
      operationId: startJob
      x-implemented: true
      summary: Start a long-running operation
      x-required-scope: admin
      description: |
        Accepted, not performed. These walk every game in EVERY library against up to
        three external providers; run inline they take minutes and any reverse proxy
        kills the request first. Poll the returned job.

        Instance-wide by definition — that is why this is admin-only. A caller refreshing
        their own library uses `POST /library/refresh`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind:
                  type: string
                  description: |
                    `checkReleases` promotes released games and sends due reminders;
                    `updatePrices` re-reads Steam prices; `refreshCrackStatus` re-reads
                    the DRM cache; `refreshMetadata` re-fetches metadata. Started here
                    they are all `scope: instance`; `POST /library/refresh` starts a
                    `refreshMetadata` job with `scope: self`.
                  enum: [refreshMetadata, checkReleases, refreshCrackStatus, updatePrices]
              additionalProperties: false
      responses:
        '202':
          description: Accepted. Poll `GET /jobs/{jobId}`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
          headers:
            Location:
              description: The job resource to poll.
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '409':
          description: A job of that kind is already running.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /jobs/{jobId}:
    parameters:
      - name: jobId
        in: path
        required: true
        schema: { type: string, maxLength: 64 }
    get:
      tags: [jobs]
      operationId: getJob
      x-implemented: true
      summary: Job status and result
      x-required-scope: library
      description: |
        Readable by the account that STARTED the job. An instance-wide job (`POST /jobs`)
        belongs to the administrator who started it; a per-library refresh
        (`POST /library/refresh`) belongs to its caller.

        Someone else's job id is a `404`, never a `403` — the same precedence rule as
        everywhere else, and the reason job ids must be unguessable rather than
        sequential. A 404-vs-403 distinction is only worth having if the id cannot be
        enumerated.

        `library`-scoped rather than admin because `POST /library/refresh` is, and an
        operation that hands back a job its own caller cannot poll is not an operation.
        OWNERSHIP, not scope, is what protects the instance-wide results — which matters
        because `JobResult.failures[]` names game ids from every user's library.
      responses:
        '200':
          description: The job.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: gt_pat_<base64url>
      description: |
        A personal access token from `create-api-token.js`. v1 session JWTs are not
        accepted by v2 — a JWT carries no scope, so honouring one would make the admin
        boundary bypassable by logging in with a password.

  responses:
    Unauthorized:
      description: |
        Missing, unknown, expired, or belonging to a deleted account — all answered
        identically on purpose, so the response is not an oracle for which guess was
        once a real token. `code` is `unauthenticated`.

        Distinct from `403`, which means the credential is valid but lacks the scope.
        Collapsing the two would leave a client unable to tell "re-authenticate" from
        "stop retrying" without parsing English, which `Problem` tells it never to do.
      headers:
        WWW-Authenticate:
          description: RFC 9110 §15.5.2 — the scheme this API accepts.
          schema: { type: string }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: |
        Authenticated, but this credential may not do that — usually a `library`-scoped
        token on an admin operation.

        **Authorization is decided BEFORE existence.** A credential lacking the required
        scope receives `403` for every id, whether or not it exists. `404` is only ever
        reachable by a credential that was already authorized to look.

        Checking existence first is the natural way to write these handlers and it turns
        every admin route into a user-enumeration oracle: `404` for an id that is not
        there, `403` for one that is, from a token with no admin scope at all.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: No such resource, or not one this credential may see. The two are not distinguished.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    # Rate limiting is specified on the five operations that spend something a caller
    # does not own: paid IGDB/RAWG quota (catalog search, add-by-name), a full-library
    # external sweep (jobs), and the username-enumeration primitive that the share
    # writes' `unknownUsers` body would otherwise be. v1's only limiter lives inside the
    # login route, and v2 has no login, so without this v2 has none at all.
    RateLimited:
      description: Too many requests. Retry after the interval in `Retry-After`.
      headers:
        Retry-After:
          description: Seconds to wait.
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    BadRequest:
      description: The request was malformed or failed validation. `code` says which class of problem; `errors` names the fields.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:

    Problem:
      type: object
      description: |
        RFC 9457 `application/problem+json`.

        Branch on **`code`**, never on `title` or `detail` — those are human text and may
        be reworded. `code` is a closed, stable set.

        **`detail` is present only for codes marked `x-expose: true` below.** It is never
        an exception message, a stack trace, a database error, or any part of an upstream
        provider's response. `provider_unavailable`, `internal` and `settings_unreadable`
        never carry a `detail`, because there is nothing about them that can be said
        safely — the interesting content is exactly the content that must not leave the
        server.

        This mirrors the `expose` column in `services/problem.js`, which is the single
        table deciding whether a service's message may be shown to a caller. Publishing
        the rule here keeps the document and that table honest about the same thing.

        Extension members are permitted, but only the two defined in this document
        (`candidates`, `unknownUsers`). `additionalProperties` stays open because the
        extension schemas compose with `allOf`, where `false` would see only its own
        branch and reject `type`/`title`/`status`/`code`.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri-reference
          description: A stable identifier for the problem class.
          examples: ['/problems/validation']
        title: { type: string, description: Short human summary. Do not parse. }
        status: { type: integer, description: Repeats the HTTP status. }
        detail:
          type: string
          maxLength: 500
          description: |
            Human explanation of this occurrence. Present ONLY for codes whose `x-expose`
            is true. Never derived from an exception, a database error, or an upstream
            response body.
        code:
          type: string
          description: |
            The machine-readable class. v1 had no equivalent, so a client could not tell
            a validation failure from an unknown user without matching on English.
          enum: [validation, unauthenticated, forbidden, not_found, unknown_users, not_shared, not_in_backlog, conflict, rate_limited, provider_unavailable, settings_unreadable, internal]
          x-expose:
            # Must agree with PROBLEMS[code].expose in services/problem.js for every code
            # that exists there; the CI gate asserts it. The four codes with no v1
            # counterpart are false, which is the safe direction for a new code.
            validation: true
            # The refusal text says which credential type is accepted; it reveals
            # nothing about whether a token was once real. All five failure modes
            # (missing, malformed, unknown, expired, orphaned) share one message.
            unauthenticated: true
            forbidden: true
            not_found: false
            unknown_users: true
            not_shared: false
            not_in_backlog: false
            conflict: true
            rate_limited: false
            provider_unavailable: false
            settings_unreadable: false
            internal: false
        errors:
          type: array
          description: Field-level detail, when the problem is field-level.
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }
            additionalProperties: false
      additionalProperties: true

    AmbiguousGameProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [candidates]
          properties:
            candidates:
              type: array
              description: What the name matched. Pick one and retry with its `gameId`.
              items: { $ref: '#/components/schemas/CatalogGame' }

    UnknownUsersProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [unknownUsers]
          properties:
            unknownUsers:
              type: array
              description: The names that did not resolve. Nothing was changed.
              items: { type: string }

    GameRef:
      type: string
      description: |
        A source-prefixed game id, e.g. `igdb_12345`.

        **Always a string, never a number.** The same numeric id exists at more than one
        provider, so the prefix is what keeps them apart. The underlying column was once
        *declared* `INTEGER` while storing these strings, which worked only because
        SQLite is permissive; a client that coerces this corrupts ids in transit.
      pattern: '^(igdb|rawg|thegamesdb)_[A-Za-z0-9_-]+$'
      maxLength: 200
      examples: ['igdb_12345', 'rawg_3498']

    Username:
      type: string
      description: |
        Lowercase; login is case-insensitive. Bounded and patterned because a username
        reaches an LDAP filter, a SQL parameter and a log line — `ldap-helpers.js` escapes
        the filter, but an unbounded value is still a denial-of-service vector on every
        one of those paths.
      minLength: 1
      maxLength: 64
      pattern: '^[a-z0-9._-]+$'

    Password:
      type: string
      description: |
        `maxLength` is not cosmetic: an unbounded string reaching `bcrypt.hash` is cheap
        CPU exhaustion, and this is reachable on an admin route.
      minLength: 8
      maxLength: 200
      writeOnly: true

    GameStatus:
      type: string
      description: |
        `unreleased` is assigned by the server from the release date and moves to
        `wishlist` automatically once the game is out; the other four are the user's.
      enum: [wishlist, playing, done, backlog, unreleased]

    LibraryGame:
      type: object
      description: A game in someone's library. camelCase throughout, one spelling per field.
      required: [gameId, name, status]
      properties:
        gameId: { $ref: '#/components/schemas/GameRef' }
        name: { type: string }
        coverUrl: { type: [string, 'null'], format: uri }
        releaseDate:
          type: [string, 'null']
          format: date
          description: YYYY-MM-DD. Null when the source gives no usable date.
        status: { $ref: '#/components/schemas/GameStatus' }
        steamAppId: { type: [string, 'null'] }
        lastPrice:
          type: [string, 'null']
          description: Formatted in the configured storefront region, e.g. "₪59.99". A display string, not a number — the currency is part of it.
        lastPriceUpdatedAt: { type: [string, 'null'], format: date-time }
        crackStatus:
          # oneOf rather than `type: [string,'null']` + `enum: [..., null]`: the latter is
          # the shape most likely to emit a literal `NULL = "null"` member in a generated
          # client. This is the document's only nullable enum.
          oneOf:
            - { $ref: '#/components/schemas/CrackStatus' }
            - { type: 'null' }
        backlogOrder: { type: [integer, 'null'], description: Position in the backlog. Null unless status is `backlog`. }
        addedAt: { type: [string, 'null'], format: date-time }
      additionalProperties: false

    LibraryGameCreate:
      type: object
      description: Supply `gameId` OR `name`, not both.
      properties:
        gameId: { $ref: '#/components/schemas/GameRef' }
        name: { type: string, minLength: 1, maxLength: 400, description: Resolved server-side; ambiguity is a 409, never a guess. }
        status:
          # $ref with siblings: legal in OpenAPI 3.1 (JSON Schema 2020-12) and
          # deliberate — an allOf wrapper would hide the enum from a generator, which is
          # exactly what test/openapi.test.js forbids.
          $ref: '#/components/schemas/GameStatus'
          default: wishlist
          description: |
            Optional. A game that is already in the library KEEPS its current status
            when this is omitted — re-adding a game you are playing does not demote it
            back to `wishlist`, which is the failure mode for a client that does not
            track what it has already added. Only a genuinely new game takes the
            default, `wishlist`: the neutral landing place, and the one status that
            allocates no backlog position.

            A future-dated game is stored as `unreleased` whatever is asked for here.
      oneOf:
        - required: [gameId]
        - required: [name]
      additionalProperties: false

    LibraryGameUpdate:
      type: object
      description: |
        Partial. Note there is no `releaseDate`: status is re-derived from the stored
        date, and accepting one here would reintroduce v1's trap.
      properties:
        status: { $ref: '#/components/schemas/GameStatus' }
      minProperties: 1
      additionalProperties: false

    ReorderMeta:
      type: object
      description: Named rather than inline so a generated client gets `ReorderMeta`, not an anonymous type.
      required: [updated, requested]
      properties:
        updated: { type: integer, description: Rows that actually moved. Ids not in the caller's library match nothing and are ignored. }
        requested: { type: integer, description: Ids supplied. }
      additionalProperties: false

    NotificationSettings:
      type: object
      description: |
        The caller's own delivery targets. Returned ONLY on `/me/notifications`, never on
        `User` and never for another account.
      properties:
        email: { type: [string, 'null'], format: email, maxLength: 320 }
        ntfyUrl: { type: [string, 'null'], format: uri, maxLength: 500, description: Falls back to the instance default when empty. }
        ntfyTopic: { type: [string, 'null'], maxLength: 200, description: A bearer secret — anyone who knows the topic can publish to it. }
        gotifyUrl: { type: [string, 'null'], format: uri, maxLength: 500 }
        gotifyToken: { type: [string, 'null'], maxLength: 200, description: A bearer secret — grants posting to this user's devices. }
        telegramChatId: { type: [string, 'null'], maxLength: 64 }
        notificationDays:
          type: array
          description: Days before release to send a reminder. Defaults to 0, 7 and 30.
          items: { type: integer, minimum: 0, maximum: 365 }
          maxItems: 20
      additionalProperties: false

    NotificationSettingsUpdate:
      type: object
      description: Partial. Absent keys are left alone; an explicit null clears.
      properties:
        email: { type: [string, 'null'], format: email, maxLength: 320 }
        ntfyUrl: { type: [string, 'null'], maxLength: 500 }
        ntfyTopic: { type: [string, 'null'], maxLength: 200 }
        gotifyUrl: { type: [string, 'null'], maxLength: 500 }
        gotifyToken: { type: [string, 'null'], maxLength: 200 }
        telegramChatId: { type: [string, 'null'], maxLength: 64 }
        notificationDays:
          type: array
          items: { type: integer, minimum: 0, maximum: 365 }
          maxItems: 20
      minProperties: 1
      additionalProperties: false

    BacklogEntry:
      type: object
      required: [gameId, position]
      properties:
        gameId: { $ref: '#/components/schemas/GameRef' }
        name: { type: string }
        position: { type: integer, minimum: 1 }
      additionalProperties: false

    CrackStatus:
      type: string
      enum: [cracked, uncracked, unknown]

    CatalogGame:
      type: object
      description: A search result. `id` is what you post back to add the game.
      required: [id, name, source]
      properties:
        id: { $ref: '#/components/schemas/GameRef' }
        name: { type: string }
        releaseDate: { type: [string, 'null'], format: date }
        coverUrl: { type: [string, 'null'], format: uri }
        source: { type: string, enum: [igdb, rawg, thegamesdb] }
        steamAppId: { type: [string, 'null'] }
      additionalProperties: false

    ProviderStatus:
      type: object
      required: [name, status]
      properties:
        name: { type: string, enum: [igdb, rawg, thegamesdb] }
        status:
          type: string
          description: |
            `ok` answered; `skipped` is not configured (no API key); `failed` was asked
            and did not answer. `skipped` and `failed` mean very different things
            operationally and are not merged.
          enum: [ok, skipped, failed]
        count: { type: integer, description: Results this provider contributed before de-duplication. }
      additionalProperties: false

    SearchMeta:
      type: object
      required: [degraded, providers]
      properties:
        degraded:
          type: boolean
          description: |
            True when at least one provider failed. **An empty `data` with `degraded:
            true` does not mean the game does not exist** — it means the question could
            not be fully asked.
        providers:
          type: array
          items: { $ref: '#/components/schemas/ProviderStatus' }
        total: { type: integer, description: Results returned after merge and de-duplication. }
      additionalProperties: false

    PageMeta:
      type: object
      required: [total]
      properties:
        total: { type: integer, description: Rows matching the filter, ignoring paging. }
        limit: { type: integer }
        nextCursor:
          type: [string, 'null']
          description: Pass back as `cursor` for the next page. Null on the last page. Opaque — do not construct or parse one.
      additionalProperties: false

    Me:
      type: object
      required: [id, username, canManageUsers, scopes]
      properties:
        id: { type: integer }
        username: { type: string }
        displayName: { type: string }
        origin: { type: string, enum: [local, ldap], description: Where the account authenticates. LDAP accounts have no local password. }
        canManageUsers:
          type: boolean
          description: |
            **Effective**, after scope narrowing — not the account's raw privilege. An
            administrator using a `library`-scoped token sees `false` here, and that is
            the correct answer for what this credential can do.
        scopes:
          type: array
          items: { type: string, enum: [library, admin] }
        tokenExpiresAt: { type: [string, 'null'], format: date-time, description: Null when the token has no expiry. Revocation, not expiry, is the safety mechanism. }
      additionalProperties: false

    Token:
      type: object
      required: [id, name, scopes, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        hint: { type: [string, 'null'], description: Last four characters of the secret, so a token in a config file can be matched to its row. }
        scopes:
          type: array
          items: { type: string, enum: [library, admin] }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: [string, 'null'], format: date-time, description: Advisory, and updated at most once a minute. }
        expiresAt: { type: [string, 'null'], format: date-time }
      additionalProperties: false

    TokenCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 60, description: Unique per account, so a revocation list is unambiguous. }
        scopes:
          type: array
          items: { type: string, enum: [library, admin] }
          default: [library]
          description: An unknown scope is refused, not silently dropped.
        expiresAt: { type: [string, 'null'], format: date-time, description: Must be in the future. Omit for no expiry. }
      additionalProperties: false

    TokenCreated:
      allOf:
        - $ref: '#/components/schemas/Token'
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: |
                **The only copy.** Store it now; it is hashed on arrival and cannot be
                shown again by this API or recovered from the database.
              # Deliberately SHORT. A realistic-length placeholder here matched the
              # gt_pat_ rule in .gitleaks.toml (bounded at 40+ characters so real tokens
              # match and test literals do not) and failed the secret-scan job, which
              # gates deploy. Do not allowlist openapi/ to accommodate a longer fake —
              # that would weaken a rule whose whole justification is that this prefix
              # is scanner-matchable.
              example: 'gt_pat_EXAMPLE_NOT_A_REAL_TOKEN'

    Share:
      type: object
      required: [username]
      properties:
        username: { $ref: '#/components/schemas/Username' }
        displayName: { type: string }
        sharedAt: { type: [string, 'null'], format: date-time }
      additionalProperties: false

    User:
      type: object
      description: |
        No notification targets, by design — see `listUsers`. No password field in any
        direction of any response.
      required: [id, username, canManageUsers]
      properties:
        id: { type: integer }
        username: { type: string }
        displayName: { type: [string, 'null'] }
        email: { type: [string, 'null'], format: email }
        canManageUsers: { type: boolean }
        origin: { type: string, enum: [local, ldap] }
        sharesLibrary: { type: boolean }
        createdAt: { type: [string, 'null'], format: date-time }
      additionalProperties: false

    UserCreate:
      type: object
      required: [username, password]
      properties:
        username: { $ref: '#/components/schemas/Username' }
        password: { $ref: '#/components/schemas/Password' }
        email: { type: string, format: email, maxLength: 320 }
        canManageUsers: { type: boolean, default: false }
        sharesLibrary: { type: boolean, default: false }
      additionalProperties: false

    UserUpdate:
      type: object
      properties:
        password: { $ref: '#/components/schemas/Password' }
        email: { type: [string, 'null'], format: email, maxLength: 320 }
        canManageUsers: { type: boolean }
        sharesLibrary: { type: boolean }
      minProperties: 1
      additionalProperties: false

    MaskedSecret:
      type: string
      description: |
        A stored secret, never its value.

        `__unchanged__` when a secret is set, `""` when it is not. The mask NEVER contains
        any character of the real value.

        Writing `__unchanged__` back leaves the stored secret untouched; writing `""`
        clears it; omitting the key leaves it untouched. That is what makes a
        read-modify-write safe.

        This is a closed enum rather than a free string on purpose. The codebase has
        historically carried two incompatible masks — this reversible sentinel, and one
        that emitted the last six characters of an API key. An implementer choosing the
        second for an LDAP bind password would disclose six characters of it over the
        wire, and a client round-tripping the masked form would store the mask AS the
        key, destroying it.
      enum: ['__unchanged__', '']

    ApiKeyState:
      type: object
      description: |
        Whether a key is configured and where it comes from — never the key.

        API keys are deliberately NOT round-trippable: there is no masked form to write
        back, so a read-modify-write cannot destroy them. Set them through
        `SettingsUpdate`, which is write-only for these fields.

        **This schema must never gain a field carrying any part of the key** — not the
        value, not a prefix, not a suffix. "Let an admin confirm which key is set" is a
        plausible request that `configured` and `source` already answer; anything more
        defeats the reason this is state rather than a masked value.
      required: [configured]
      properties:
        configured: { type: boolean }
        source:
          type: [string, 'null']
          enum: [settings, env, null]
          description: |
            `settings` overrides `env`. Knowing which is in force is the difference
            between "restart the container" and "edit it here".
      additionalProperties: false

    MaskedSettings:
      type: object
      description: |
        Server configuration as READ. Every secret is a `MaskedSecret`; API keys are
        reported as state only.
      properties:
        degraded:
          type: boolean
          description: |
            True when the settings file could not be read. Everything else in the
            response is then defaults, not configuration.

            Without this the response repeats v1's own defect one level down: a masked
            body that is empty because the file is unreadable cannot be told apart from
            one that is empty because nothing is configured.
        apikeys:
          type: object
          properties:
            igdbClientId: { $ref: '#/components/schemas/ApiKeyState' }
            igdbClientSecret: { $ref: '#/components/schemas/ApiKeyState' }
            igdbBearerToken: { $ref: '#/components/schemas/ApiKeyState' }
            rawgApiKey: { $ref: '#/components/schemas/ApiKeyState' }
            thegamesdbApiKey: { $ref: '#/components/schemas/ApiKeyState' }
          additionalProperties: false
        smtp:
          type: object
          properties:
            host: { type: string, maxLength: 500 }
            port: { type: integer }
            user: { type: string, maxLength: 500 }
            pass: { $ref: '#/components/schemas/MaskedSecret' }
            from: { type: string, maxLength: 500 }
            to: { type: string, maxLength: 500, description: Default recipient. Present in settings.example.json; a client rejecting it would reject the real response. }
          additionalProperties: false
        ntfy:
          type: object
          properties:
            url:
              type: string
              maxLength: 500
              description: |
                Optional instance-wide default; each user sets their own server and topic.
                Not validated here — the cloud instance-metadata blocklist is applied at
                the SEND sink, where it also covers the per-user URLs this field only
                defaults. Do not move that check here and delete it there.
          additionalProperties: false
        gotify:
          type: object
          properties:
            url: { type: string, maxLength: 500, description: See ntfy.url on where the SSRF guard lives. }
          additionalProperties: false
        telegram:
          type: object
          properties:
            botToken: { $ref: '#/components/schemas/MaskedSecret' }
          additionalProperties: false
        ldap:
          type: object
          properties:
            url: { type: string, maxLength: 500 }
            base: { type: string, maxLength: 500 }
            bindDn: { type: string, maxLength: 500 }
            bindPass: { $ref: '#/components/schemas/MaskedSecret' }
            requiredGroup: { type: string, maxLength: 500 }
          additionalProperties: false
      additionalProperties: false

    SettingsUpdate:
      type: object
      description: |
        Server configuration as WRITTEN. Partial per section: keys absent from a section
        are left alone rather than deleted.

        Secrets are plain strings here — send `__unchanged__` to keep the stored value,
        which is exactly what a client that just read `MaskedSettings` sends back.

        Every field is bounded. The bound belongs on the WRITE schema, which is the one a
        caller controls; an earlier revision bounded only the read side, which protects
        nobody. These values land in `settings.json`, rewritten in place.
      properties:
        smtp:
          type: object
          properties:
            host: { type: string, maxLength: 500 }
            port: { type: integer, minimum: 1, maximum: 65535 }
            user: { type: string, maxLength: 500 }
            pass: { type: string, maxLength: 500 }
            from: { type: string, maxLength: 500 }
            to: { type: string, maxLength: 500, description: Readable on MaskedSettings and writable here — omitting it made it unsettable in v2 at all. }
          additionalProperties: false
        ntfy:
          type: object
          properties:
            url: { type: string, maxLength: 500, description: Optional instance-wide default. Each user sets their own server and topic. }
          additionalProperties: false
        gotify:
          type: object
          properties:
            url: { type: string, maxLength: 500 }
          additionalProperties: false
        telegram:
          type: object
          properties:
            botToken: { type: string, maxLength: 500 }
          additionalProperties: false
        ldap:
          type: object
          properties:
            url: { type: string, maxLength: 500 }
            base: { type: string, maxLength: 500 }
            bindDn: { type: string, maxLength: 500 }
            bindPass: { type: string, maxLength: 500 }
            requiredGroup: { type: string, maxLength: 500 }
          additionalProperties: false
        apikeys:
          type: object
          description: |
            Write-only. Overrides the corresponding environment variable and takes effect
            without a restart. Never returned — `MaskedSettings` reports only
            `ApiKeyState`, which is what makes a read-modify-write safe.
          writeOnly: true
          properties:
            igdbClientId: { type: string, maxLength: 500 }
            igdbClientSecret: { type: string, maxLength: 500, description: Used only to refresh the bearer token. }
            igdbBearerToken: { type: string, maxLength: 500, description: Twitch OAuth tokens expire about every 60 days. }
            rawgApiKey: { type: string, maxLength: 500 }
            thegamesdbApiKey: { type: string, maxLength: 500 }
          additionalProperties: false
      additionalProperties: false

    Job:
      type: object
      required: [id, kind, status, scope]
      properties:
        id: { type: string, description: Unguessable, not sequential — see getJob on why the 404 depends on it. }
        scope:
          type: string
          description: |
            `self` covers only the starting account's library; `instance` covers every
            library. Without this the same `kind` cannot express both, and a caller
            cannot tell which one they are looking at.
          enum: [self, instance]
        kind: { type: string, enum: [refreshMetadata, checkReleases, refreshCrackStatus, updatePrices] }
        status: { type: string, enum: [queued, running, succeeded, failed] }
        startedAt: { type: [string, 'null'], format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        result:
          oneOf:
            - { $ref: '#/components/schemas/JobResult' }
            - { type: 'null' }
          description: Present once finished.
        error:
          oneOf:
            - { $ref: '#/components/schemas/FailureReason' }
            - { type: 'null' }
          description: |
            Present when the job failed as a whole rather than per item. A CLOSED reason,
            never an exception message — see JobResult.
      additionalProperties: false

    FailureReason:
      type: string
      description: |
        Why something failed, as a closed set.

        Deliberately not free text. These jobs are exactly the sweeps that call IGDB,
        RAWG, TheGamesDB, Steam and CrackWatch, and a provider's error body carries
        endpoint paths, quota state and occasionally the failing key — RAWG's travels as
        a query parameter. `services/catalog.js` exists in large part to stop any of that
        reaching a caller; a free-text `error` field here would hand an implementer the
        obvious `err.message` and undo it. This deployment has already shipped a stack
        trace in a response body once.
      enum: [provider_unavailable, rate_limited, not_found, invalid_data, internal]

    JobResult:
      type: object
      description: |
        Counts plus bounded per-item failures. A sweep where everything failed and one
        where everything succeeded must not read the same — that was a real defect in
        the v1 price sweep, which reported success while writing nothing.
      required: [processed, succeeded, failed]
      properties:
        processed: { type: integer, minimum: 0 }
        succeeded: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
        failures:
          type: array
          maxItems: 200
          description: Truncated at 200; `failed` remains the true count.
          items:
            type: object
            required: [gameId, reason]
            properties:
              gameId: { $ref: '#/components/schemas/GameRef' }
              reason: { $ref: '#/components/schemas/FailureReason' }
            additionalProperties: false
      additionalProperties: false
