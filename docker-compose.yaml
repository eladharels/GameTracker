services:
  # ───────────────────────────────────────────────────────────────────────────
  # PostgreSQL — GameTracker's OWN database.
  #
  # This host runs other Postgres instances (an unrelated app on postgres:16-alpine,
  # Guacamole on postgres:15.2-alpine). This one is deliberately separate: its own
  # container, database, role and volume. Do not point GameTracker at any of them.
  #
  # The port is NOT published. Nothing outside the compose network needs it, and
  # every other database container on this host follows the same pattern.
  # ───────────────────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: postgres-gametracker
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-gametracker}
      - POSTGRES_USER=${POSTGRES_USER:-gametracker}
      # Fail fast rather than booting a database with a blank or default password.
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (see .env)}
    volumes:
      # Named volume, not a bind mount: a bind mount under /home/docker/gametracker/
      # would need its ownership matched to the postgres UID inside the image, which
      # is a recurring source of "database directory has wrong ownership" failures.
      # A named volume avoids that class of problem entirely.
      - gametracker-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gametracker} -d ${POSTGRES_DB:-gametracker}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  backend:
    image: local/gametracker-backend:latest
    pull_policy: never
    ports:
      # BACKEND_BIND controls which host interface the backend is published on.
      #
      # Defaults to 0.0.0.0 because this deployment's reverse proxy lives on a
      # DIFFERENT machine and reaches the backend across the network — a loopback
      # bind would black-hole the API.
      #
      # SECURITY: on 0.0.0.0 the backend is reachable directly, bypassing nginx. With
      # `trust proxy` set, a client connecting straight to this port controls
      # X-Forwarded-For and can present a fresh IP on every login attempt, walking
      # through the rate limiter. Prefer 127.0.0.1.
      #
      # To close that: frontend/nginx.conf now proxies /api to the backend over the
      # compose network, so the frontend port alone can serve the whole app. Point
      # the reverse proxy at the FRONTEND port for everything, then set
      # BACKEND_BIND=127.0.0.1 (or drop this ports: entry) — and set TRUST_PROXY=2,
      # because that adds a second proxy hop. See README "Reverse proxy topology".
      - "${BACKEND_BIND:-0.0.0.0}:${BACKEND_PORT:-3000}:3000"
    volumes:
      # The SQLite mount is gone. These two JSON files are still file-backed in this
      # phase; moving them into Postgres is tracked as follow-up work. Bind-mounted
      # files stay writable even with read_only: true below — only the container's
      # own filesystem layers become read-only.
      - /home/docker/gametracker/data/settings.json:/app/settings.json
      - /home/docker/gametracker/data/sent_notifications.json:/app/sent_notifications.json
    environment:
      # Fixed INSIDE the container so frontend/nginx.conf can proxy to a stable
      # `backend:3000`; only the published host port varies per environment.
      - PORT=3000
      - NODE_ENV=production
      # Database connection. The host is the compose SERVICE name (db), not the
      # container_name — service names are what the compose network resolves.
      - PGHOST=db
      - PGPORT=5432
      - PGDATABASE=${POSTGRES_DB:-gametracker}
      - PGUSER=${POSTGRES_USER:-gametracker}
      - PGPASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (see .env)}
      # Ephemeral caches on tmpfs — required for read_only: true. See CACHE_DIR in index.js.
      - CACHE_DIR=/app/cache
      - IGDB_CLIENT_ID=${IGDB_CLIENT_ID}
      - IGDB_BEARER_TOKEN=${IGDB_BEARER_TOKEN}
      - RAWG_API_KEY=${RAWG_API_KEY}
      # No insecure default — JWT_SECRET must be provided (via .env or the shell env).
      # The backend refuses to start if it is missing, too short, or 'supersecretkey'.
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set (see .env)}
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    # Now possible: SQLite's need for a writable /app (WAL + journal files) was the
    # only thing preventing this. The two remaining JSON files are bind mounts, which
    # are unaffected by read_only, and the ephemeral caches live on the tmpfs below.
    read_only: true
    tmpfs:
      - /tmp
      - /app/cache
    restart: unless-stopped
    # Production had NO healthcheck, so nothing could wait on this service being ready
    # — `condition: service_healthy` is not expressible against a service that never
    # reports health. The smoke stack has had this same probe all along, which is why
    # its ordering was correct and production's was not.
    #
    # /api/health is unauthenticated by design (see test/api-surface.test.js's
    # two-item allowlist), and `curl` is in the image for exactly this.
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      # Generous: on a cold start this waits for the schema migration, which runs
      # before the server listens and is fatal if it fails.
      start_period: 30s

  # The MCP server: a protocol translator between AI clients and /api/v2.
  #
  # A SEPARATE CONTAINER, deliberately. It is the least-trusted consumer in this design
  # — services/auth.js says so in the comment explaining why token scopes may only ever
  # narrow — and running it inside the backend would give it the database, settings.json
  # and the LDAP bind password by proximity. Here it has a network route to `backend`
  # and nothing else: no volumes, no database, no secrets, no writable path.
  #
  # It holds NO CREDENTIALS. Every request must carry its own
  # `Authorization: Bearer gt_pat_...`, which it forwards to the API unchanged, so
  # authorization stays the backend's and reaching this port grants nothing on its own.
  mcp:
    image: local/gametracker-mcp:latest
    pull_policy: never
    ports:
      # 127.0.0.1 by DEFAULT, unlike the backend. This is an agent-facing surface and
      # the common case is an MCP client on this same host.
      #
      # To reach it from another machine, set MCP_BIND to the LAN address it should
      # answer on (e.g. MCP_BIND=192.168.1.30) or 0.0.0.0 for every interface.
      # MCP_PUBLIC_HOST below follows it automatically, so one variable is enough.
      #
      # A personal access token then crosses the network in a cleartext header. On a
      # trusted LAN that may be acceptable; over anything else, put TLS in front.
      - "${MCP_BIND:-127.0.0.1}:${MCP_PORT:-3001}:3001"
    environment:
      - NODE_ENV=production
      # The compose SERVICE name, not the published port: this talks to the backend
      # over the internal network and never leaves it.
      - GAMETRACKER_API_URL=http://backend:3000/api/v2
      - MCP_PORT=3001
      # Always 0.0.0.0 INSIDE the container — what decides who can reach it is the
      # ports mapping above, which binds one host interface.
      - MCP_BIND=0.0.0.0
      # The address CLIENTS use, which is the host interface the port is published on.
      # The container cannot infer it: it only ever sees 0.0.0.0. Without this, setting
      # MCP_BIND to a LAN address publishes the port correctly and then the server
      # rejects every request to it, because the Host header names an address its
      # DNS-rebinding allowlist has never heard of.
      - MCP_PUBLIC_HOST=${MCP_BIND:-127.0.0.1}
      # For anything the above cannot infer — a DNS name, a reverse proxy in front,
      # several addresses. ADDS to the defaults; it cannot lock out localhost.
      - MCP_ALLOWED_HOSTS=${MCP_ALLOWED_HOSTS:-}
    # service_healthy, matching the frontend and the smoke stack. The list form used
    # here previously means service_STARTED, which is satisfied the moment the process
    # exists — so an MCP client connecting during a deploy got tool errors from a
    # backend that was still migrating. Keeping the two compose files identical in
    # shape is the point: the frontend's missing ordering survived precisely because
    # production and the test stack had drifted.
    depends_on:
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    # Nothing to write. It reads no config file, keeps no cache and stores no state —
    # /tmp is here only because Node may want it.
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  frontend:
    image: local/gametracker-frontend:latest
    pull_policy: never
    ports:
      - "8080:8080"
    # Without this the frontend came up SECONDS before the backend on every deploy —
    # measured at 6s on 2026-07-28 (nginx serving at :12, API reachable at :18). In
    # that window the SPA loads and every /api call fails, which the library page
    # rendered as an empty library. It reads as "my games were deleted".
    #
    # nginx itself does not need this: proxy_pass uses a variable plus
    # `resolver 127.0.0.11 valid=10s`, so it starts without the upstream and
    # re-resolves per request. What this fixes is the BROWSER being handed a working
    # app whose API is not up yet.
    #
    # The smoke stack has had this since it was written. Production did not, and the
    # smoke test therefore could never have caught it.
    depends_on:
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    restart: unless-stopped

volumes:
  gametracker-pgdata:
