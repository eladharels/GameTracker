version: '3.8'
services:
  backend: # nosemgrep: yaml.docker-compose.security.writable-filesystem-service.writable-filesystem-service
    image: local/gametracker-backend:latest
    pull_policy: never
    ports:
      # Bound to LOOPBACK. Published on 0.0.0.0 the backend was reachable directly,
      # bypassing nginx — and with `trust proxy: 1` a client connecting straight to
      # :3000 controls X-Forwarded-For, so every login attempt could claim a fresh
      # IP and walk straight through the rate limiter. The frontend container reaches
      # the backend over the compose network, not this published port.
      - "127.0.0.1:${BACKEND_PORT:-3000}:3000"
    volumes:
      - /home/docker/gametracker/data/gametracker.db:/app/gametracker.db
      - /home/docker/gametracker/data/settings.json:/app/settings.json
      - /home/docker/gametracker/data/sent_notifications.json:/app/sent_notifications.json
    environment:
      # Fixed INSIDE the container so frontend/nginx.conf can proxy to a stable
      # `backend:3000`; only the published host port varies per environment.
      - PORT=3000
      - NODE_ENV=production
      - IGDB_CLIENT_ID=${IGDB_CLIENT_ID}
      - IGDB_BEARER_TOKEN=${IGDB_BEARER_TOKEN}
      - RAWG_API_KEY=${RAWG_API_KEY}
      # No insecure default — JWT_SECRET must be provided (via .env or the shell env).
      # The backend refuses to start if it is missing, too short, or 'supersecretkey'.
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set (see .env)}
    security_opt:
      - no-new-privileges:true
    # read_only: true cannot be set — SQLite requires a writable /app/ directory
    # for WAL and journal files alongside the mounted gametracker.db file.
    restart: unless-stopped

  frontend:
    image: local/gametracker-frontend:latest
    pull_policy: never
    ports:
      - "8080:8080"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    restart: unless-stopped
