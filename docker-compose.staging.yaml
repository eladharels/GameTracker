version: '3.8'
services:
  backend: # nosemgrep: yaml.docker-compose.security.writable-filesystem-service.writable-filesystem-service
    image: local/gametracker-backend:staging
    container_name: gametracker-backend-staging
    pull_policy: never
    ports:
      # Loopback-bound, and the CONTAINER port is fixed at 3000 so the frontend
      # image's nginx /api proxy resolves `backend:3000` in every environment.
      - "127.0.0.1:${BACKEND_PORT_STAGING:-3001}:3000"
    volumes:
      - /home/docker/gametracker/data-stag/gametracker.db:/app/gametracker.db
      - /home/docker/gametracker/data-stag/settings.json:/app/settings.json
      - /home/docker/gametracker/data-stag/sent_notifications.json:/app/sent_notifications.json
    environment:
      - PORT=3000
      # NOT 'staging': Express's default error handler puts err.stack in the
      # RESPONSE BODY whenever NODE_ENV !== 'production', and staging is where
      # unhandled paths are most likely to be hit. Use a separate flag if staging
      # ever needs to branch on environment.
      - NODE_ENV=production
      - IGDB_CLIENT_ID=${IGDB_CLIENT_ID}
      - IGDB_BEARER_TOKEN=${IGDB_BEARER_TOKEN}
      - RAWG_API_KEY=${RAWG_API_KEY}
      # Fail fast, mirroring production. The old `:-supersecretkey` default only
      # failed closed by accident, because that exact literal is on the backend's
      # deny-list — a one-value guard is not a substitute for requiring the secret.
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
    security_opt:
      - no-new-privileges:true
    # read_only: true cannot be set — SQLite requires a writable /app/ directory
    # for WAL and journal files alongside the mounted gametracker.db file.
    restart: unless-stopped

  frontend:
    image: local/gametracker-frontend:staging
    container_name: gametracker-frontend-staging
    pull_policy: never
    ports:
      - "8085:8080"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    restart: unless-stopped
