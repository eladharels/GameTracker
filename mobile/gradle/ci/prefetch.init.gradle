// MOB-37, phase 1 of the Android CI build (android.yml): download, WITH network, exactly the
// artifacts recorded in gradle/verification-metadata.xml, and run nothing else. Phase 2 then
// builds, tests and lints with --offline under --network none, so dependency code (kapt
// processors, lint jars, unit tests) never runs with a network.
//
// The list IS the verification metadata: it was generated from a full build, so it is the
// set phase 2 needs, and every file is still checked against it (strict) as it is fetched.
// Plugins resolve anyway, when this phase configures the build; anything the project
// repositories cannot serve is reported, not fatal: phase 2 is the test of completeness.
gradle.rootProject { root ->
    root.tasks.register('gtPrefetch') {
        doLast {
            def meta = new groovy.xml.XmlSlurper().parse(root.file('gradle/verification-metadata.xml'))
            def notations = new LinkedHashSet<String>()
            meta.components.component.each { c ->
                def g = c.@group.text(), n = c.@name.text(), v = c.@version.text()
                def prefix = "${n}-${v}"
                c.artifact.each { a ->
                    def file = a.@name.text()
                    if (!file.startsWith(prefix)) return
                    def rest = file.substring(prefix.length())
                    def dot = rest.lastIndexOf('.')
                    if (dot < 0) return
                    def ext = rest.substring(dot + 1)
                    def classifier = rest.substring(0, dot).replaceFirst('^-', '')
                    notations << (classifier ? "${g}:${n}:${v}:${classifier}@${ext}" : "${g}:${n}:${v}@${ext}")
                }
            }
            def missing = []
            notations.each { notation ->
                def cfg = root.configurations.detachedConfiguration(root.dependencies.create(notation))
                cfg.transitive = false
                def lenient = cfg.resolvedConfiguration.lenientConfiguration
                if (!lenient.unresolvedModuleDependencies.isEmpty()) missing << notation
                else lenient.files
            }
            println "[prefetch] ${notations.size()} artifacts; ${missing.size()} not served by the project repositories"
            missing.each { println "[prefetch]   ${it}" }
        }
    }
}
